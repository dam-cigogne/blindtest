<script>
"use strict";
/* ================= Outils ================= */
const $ = (s, r = document) => r.querySelector(s);

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/* Mode essai : une partie séparée sur le serveur, rien ne touche la vraie soirée */
const ESSAI = (() => {
  try {
    const q = new URLSearchParams(location.search);
    if (q.has("essai")) localStorage.setItem("bt_essai", q.get("essai") === "0" ? "0" : "1");
    else if (q.get("t") || q.get("r")) localStorage.setItem("bt_essai", "0"); // un vrai QR code ramène toujours à la vraie soirée
    return localStorage.getItem("bt_essai") === "1";
  } catch (e) { return false; }
})();
const ESSAI_Q = ESSAI ? "&essai=1" : "";
function setEssai(on) { try { localStorage.setItem("bt_essai", on ? "1" : "0"); } catch (e) {} location.href = location.pathname; }
const lk = (k) => (ESSAI ? "essai_" : "") + k;
const LS = {
  get(k, d) { try { const v = localStorage.getItem(lk(k)); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(lk(k), JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(lk(k)); } catch (e) {} },
};
const clone = (o) => JSON.parse(JSON.stringify(o));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const plural = (n, s, p) => n + " " + (n > 1 ? (p || s + "s") : s);
const ord = (n) => n + (n === 1 ? "er" : "e");
// iPhone (appli installée, iOS 26) : le système floute le haut de l'écran quand la page défile dessous.
// On fait défiler la zone de l'appli (#app) au lieu de la page entière : l'en-tête reste net.
const INSCR = navigator.standalone === true || /[?&]inscr=1/.test(location.search);
if (INSCR) document.documentElement.classList.add("inscr");
const pgEl = () => (INSCR ? document.getElementById("app") : null);
function pgY() { const e = pgEl(); return e ? e.scrollTop : window.scrollY; }
function pgTo(y) { const e = pgEl(); if (e) e.scrollTop = y; else window.scrollTo(0, y); }
function fixTop() { const t = document.querySelector(".top"); if (t && t.offsetHeight) document.documentElement.style.setProperty("--toph", t.offsetHeight + "px"); }
setInterval(fixTop, 800); addEventListener("resize", fixTop);
// 📸 Photos d'équipe
const phTeam = (p, id) => ((p && p.teams) || []).find((t) => t.id === id);
const phUrl = (t) => "/api/photo?id=" + t.id + "&v=" + t.ph + (ESSAI ? "&essai=1" : "");
function avHtml(p, id, cls) {
  const t = phTeam(p, id); if (!t) return "";
  if (t.ph) return '<img class="av ' + (cls || "") + '" src="' + phUrl(t) + '" alt="">';
  const ini = neutralName(t.name) ? String(t.id) : t.name.replace(/^(les|la|le|l')\s*/i, "").trim().slice(0, 1).toUpperCase();
  return '<span class="av ini ' + (cls || "") + '" style="background:hsl(' + (t.id * 47) % 360 + ',65%,55%)">' + esc(ini) + "</span>";
}
// Photo → carré de 480 px en JPEG (≈ 40 Ko), pour l'envoyer au serveur
function photoPick() {
  // iPhone / iPad : le champ « fichier » doit être DANS la page, sinon Safari perd la photo prise (aucun événement)
  return new Promise((res) => {
    const old = document.getElementById("phInp"); if (old) old.remove();
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.id = "phInp";

    const draw = (src, revoke) => {
      const img = new Image();

          const S2 = 800, c = document.createElement("canvas"); c.width = c.height = S2;
          const m = Math.min(img.naturalWidth, img.naturalHeight), sx = (img.naturalWidth - m) / 2, sy = (img.naturalHeight - m) / 2.6;

          if (revoke) URL.revokeObjectURL(src);
          let q = 0.8, d = c.toDataURL("image/jpeg", q);
          while (d.length > 115000 && q > 0.35) { q -= 0.1; d = c.toDataURL("image/jpeg", q); }
          if (d.length > 115000) { const c2 = document.createElement("canvas"); c2.width = c2.height = 560; c2.getContext("2d").drawImage(c, 0, 0, 560, 560); d = c2.toDataURL("image/jpeg", 0.7); }
          if (!/^data:image\/jpeg/.test(d)) throw new Error("jpeg");

        } catch (e) { toast("Photo illisible : réessayez", 3500); finish(null); }
      };

async function api(path, opt) {

    body: opt.body ? JSON.stringify(opt.body) : undefined,
  });
  let j = {};
  try { j = await r.json(); } catch (e) {}

let pollT = null, polling = false, again = false;
function interval() {
  const r = S.sess && S.sess.role, p = S.pub;
  if (r === "screen") return 900; // l'écran géant réagit vite à chaque toucher de l'animateur
  if (document.hidden && r !== "screen") return 15000;
  if (sonoOn()) return 700; // la sono doit réagir vite (extraits, bruitages)
  if (!p || p.status !== "running") return r === "anim" ? 2500 : 4000;
  if (sonoOn()) return 700; // la sono doit réagir vite quand l'animateur lance l'extrait
  return r === "team" ? 2500 : 1500;
}
async function poll() {
  clearTimeout(pollT);

  polling = true;
  const r = S.sess && S.sess.role;
  const ep = r === "anim" ? "/anim" : r === "dj" ? "/dj" : r === "team" ? "/team" : "/public";
  try {
    const d = await api(ep);
    S.fails = 0; S.data = d; S.pub = d.pub; S.offset = d.pub.now - Date.now();
    pageVersion();
    $("#net").classList.remove("off");
    onData();
  } catch (e) {
    if (e.status === 401) {
      S.fails++;
      if (S.fails >= 2) { toast("Code invalide ou équipe supprimée: reconnectez-vous", 4000); logout(); }
    } else { $("#net").classList.add("off"); }
  } finally {
    polling = false;
    if (again) { again = false; pollT = setTimeout(poll, 50); } else pollT = setTimeout(poll, interval());
  }
}

function phase(p) {
  p = p || S.pub;
  if (!p || !p.started) return { ph: "idle", left: 0, frac: 0 };
  const el = (Date.now() + S.offset - p.phaseStart) / 1000;
  const tot = p.extractSec + p.answerSec;
  if (el < p.extractSec) return { ph: "play", left: Math.max(1, Math.ceil(p.extractSec - el)), frac: el / tot };
  if (el < tot) return { ph: "write", left: Math.max(1, Math.ceil(tot - el)), frac: el / tot };
  return { ph: "done", left: 0, frac: 1 };
}

  const order = [];
  while (order.length < o.n) {
    const sh = shuffle(ths);
    if (order.length && sh.length > 1 && sh[0].id === order[order.length - 1].id) sh.push(sh.shift()); // pas deux fois le même style d'affilée

    const fin = o.fin && i === o.n - 1 && o.n > 1;

async function fakeFill() {
  if (!ESSAI) return;

    units.push({ members: mem, tr }); c += mem.length;
  }
  S.people = units; LS.set("bt_people", units);
  S.draft.teams = drawTeams(units, Math.max(2, Math.round(c / 8)));

function trOf(mem) { const c = {}; mem.forEach((m) => { if (m.tr) c[m.tr] = (c[m.tr] || 0) + 1; }); let b = "", n = 0; Object.keys(c).forEach((k) => { if (c[k] > n) { n = c[k]; b = k; } }); return b; }
function toTr(v) {

  if (!isNaN(n) && /^\d+/.test(v)) return n < 30 ? "J" : n < 50 ? "M" : "A";
  const c = v[0].toUpperCase(); return "JMA".includes(c) ? c : "";
}
function parsePaste(text) {

    const members = l.split(/\s*(?:\+|&|;|\s\/\s|\bet\b)\s*/i).map((p) => p.trim()).filter(Boolean).map((p) => {
      const m = p.match(/[\(\[]\s*([JMAjma])\s*[\)\]]\s*$/);
      return { n: p.replace(/\s*[\(\[]\s*[JMAjma]\s*[\)\]]\s*$/, "").trim(), tr: m ? m[1].toUpperCase() : "" };
    }).filter((x) => x.n);
    return { members, tr: trOf(members) };
  }).filter((u) => u.members.length);
}
function countPeople(units) { return (units || []).reduce((a, u) => a + u.members.length, 0); }
function colLetter(i) { let s = ""; i++; while (i > 0) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); } return s; }
function guessMap(hdr) {
  const f = (re, not) => { const i = hdr.findIndex((h) => re.test(h) && !(not && not.test(h))); return i < 0 ? "" : String(i); };
  return {
    name: f(/nom|name|amicaliste|adh[eé]rent|invit/i, /pr[eé]nom|first|conjoint|accomp|[eé]poux|compagn/i) || "0",
    first: f(/pr[eé]nom|first/i, /conjoint|accomp|[eé]poux|compagn/i),

}
// Lignes de données (après la ligne des titres), chacune avec son numéro de ligne Excel
function impData(imp) { return imp.all.slice(imp.hdrRow + 1).filter((x) => x.cells.some((c) => String(c).trim())); }
function impHeader(imp) { return imp.hdrRow >= 0 ? imp.all[imp.hdrRow].cells.map(String) : []; }
// Une entrée par ligne : la personne, son conjoint, ses invités
function impEntries(imp) {
  const M = imp.map, H = impHeader(imp).map((x) => x.trim().toLowerCase());
  const val = (r, c) => (c === "" || c == null ? "" : String(r[Number(c)] == null ? "" : r[Number(c)]).trim());
  const out = [];
  impData(imp).forEach((x) => {
    const r = x.cells;
    const name = [val(r, M.first), val(r, M.name)].filter(Boolean).join(" ").replace(/\s+/g, " ");
    if (!name) return;
    const tr = toTr(val(r, M.age));
    const mem = [{ n: name, tr }];
    const sp = val(r, M.spouse);
    if (sp && !/^(non|n|no|0|-|\/|aucun|aucune|n[eé]ant|sans)$/i.test(sp)) mem.push({ n: /^(oui|o|yes|y|1|x)$/i.test(sp) ? "Conjoint(e) de " + name : sp, tr });
    const nb = parseInt(val(r, M.count), 10) || 0;
    for (let k = 1; k <= Math.min(nb, 10); k++) mem.push({ n: "Invité " + k + " de " + name, tr: "" });
    // lignes à écarter d'office : totaux, titres répétés, nombres seuls
    const raw = val(r, M.name).toLowerCase();
    const junk = /^(total|sous[- ]?total|nombre|nb\b|effectif|somme)/i.test(name) || (H.length && H[Number(M.name)] === raw) || /^[\d\s.,]+$/.test(name);
    out.push({ row: x.n, mem, tr, gk: val(r, M.group), junk });
  });
  return out;
}
function unitsFromImport(imp) {
  const groups = new Map(); const units = [];
  impEntries(imp).forEach((e) => {
    if (imp.off[e.row] ?? e.junk) return;
    if (e.gk) { const k = e.gk.toLowerCase(); if (!groups.has(k)) { const u = { members: [] }; groups.set(k, u); units.push(u); } groups.get(k).members.push(...e.mem); }
    else units.push({ members: e.mem });
  });
  units.forEach((u) => (u.tr = trOf(u.members)));

}
// Devine la ligne des titres : celle qui contient « nom », « prénom »… dans les 15 premières lignes
function guessHeaderRow(all) {
  const KW = /nom|name|pr[eé]nom|conjoint|amicaliste|adh[eé]rent|invit|[aâ]ge|groupe|accomp/i;
  const lim = Math.min(all.length, 15);
  for (let i = 0; i < lim; i++) { const c = all[i].cells.filter((x) => String(x).trim()); if (c.length >= 1 && c.some((x) => KW.test(x)) && c.every((x) => !/^\d+([.,]\d+)?$/.test(String(x).trim()))) return i; }
  const first = all.findIndex((x) => x.cells.some((c) => String(c).trim()));
  return first;
}
function drawTeams(units, T) {
  const teams = Array.from({ length: T }, (_, i) => ({ id: i + 1, members: [], tr: {} }));
  const buckets = {};
  units.forEach((u) => { const k = u.tr || "?"; (buckets[k] = buckets[k] || []).push(u); });
  let order = [];
  ["J", "M", "A", "?"].forEach((k) => { if (buckets[k]) order = order.concat(shuffle(buckets[k]).sort((a, b) => b.members.length - a.members.length)); });
  order.forEach((u) => {
    const k = u.tr || "?"; let best = null;
    shuffle(teams).forEach((t) => {
      if (!best) { best = t; return; }
      const a = t.members.length + u.members.length, b = best.members.length + u.members.length;
      if (a < b || (a === b && (t.tr[k] || 0) < (best.tr[k] || 0))) best = t;
    });
    best.members.push(...u.members.map((m) => m.n)); best.tr[k] = (best.tr[k] || 0) + u.members.length;
  });
  return nameTeams(teams.map((t) => t.members));
}

  const row = (r, state, btn) => '<div class="rg ' + state + '">' + avHtml(S.pub, r.id) + '<div class="rgt"><b>' + (r.rank === 1 ? "1re" : r.rank + "e") + " · " + esc(r.name) + '</b><span class="small muted">' + plural(r.total, "point") + "</span></div>" + btn + "</div>";

    h += '<div class="rgh">① Le classement' + (rv >= nList ? " ✓" : "") + "</div>";

    '<button class="btn big rankbtn' + (g.finView === "poster" ? " ok" : "") + '" id="fvPost">🖼 Grande affiche des vainqueurs' + (g.finView === "poster" ? " ✓" : "") + "</button>" +

function readFile(file, v) {
  const go = () => {
    if (!window.XLSX) return setTimeout(go, 200);
    const fr = new FileReader();
    fr.onload = () => {
      try {
        let wb;
        if (/\.(csv|txt)$/i.test(file.name)) {
          let txt = new TextDecoder("utf-8").decode(new Uint8Array(fr.result));
          if (txt.includes("�")) txt = new TextDecoder("windows-1252").decode(new Uint8Array(fr.result));
          wb = XLSX.read(txt, { type: "string" });
        } else wb = XLSX.read(new Uint8Array(fr.result), { type: "array" });
        const pick = (name) => {
          const ws = wb.Sheets[name];
          const off = ws["!ref"] ? XLSX.utils.decode_range(ws["!ref"]).s.r : 0;
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false, blankrows: true });
          const all = rows.map((cells, k) => ({ n: k + off + 1, cells: cells.map((c) => String(c == null ? "" : c)) })).filter((x) => x.cells.some((c) => c.trim()));
          if (!all.length) return toast("Cette feuille est vide");
          const hdrRow = guessHeaderRow(all);
          S.imp = { all, hdrRow, map: guessMap(hdrRow >= 0 ? all[hdrRow].cells : []), off: {}, q: "", file: file.name, sheets: wb.SheetNames, sheet: name, wb };
          renderImpMap(v);
        };
        S.impPick = pick;
        pick(wb.SheetNames[0]);
      } catch (e) { toast("Impossible de lire ce fichier"); }
    };
    fr.readAsArrayBuffer(file);
  };
  go();
}

    return '<div class="sheet left"><div class="ev c center">' + esc(st.name) + '</div><h2 class="c center">' + who + '</h2><p class="hint center">Écrivez le titre et l\'artiste de chaque morceau. Titre = ' + pts(sc.title) + ", artiste = " + pts(sc.artist) + ", les deux = " + pts(both) + ". Rendez la feuille à l'animateur à la fin de la partie.</p><div class=\"pgrid\">" +
      st.manches.map((m, i) => '<div class="pb"><div class="ph2"><span>Manche ' + (i + 1) + " – " + esc(m.title) + (m.mult > 1 ? " (points ×" + m.mult + ")" : "") + "</span><span>" + (t ? "Éq. " + t.id : "") + '</span></div><table class="ans"><tr><th class="no"></th><th style="width:55%">Titre</th><th>' + esc(m.label2 === "Artiste" || !m.label2 ? "Artiste" : "Film / dessin animé") + '</th><th class="ck">Pts</th></tr>' +
        m.songs.map((_, j) => '<tr><td class="no">' + (j + 1) + '</td><td></td><td></td><td class="ck"></td></tr>').join("") + '<tr class="tot"><td colspan="3" style="text-align:right;font-weight:700">Total manche ' + (i + 1) + '</td><td class="ck"></td></tr></table></div>').join("") + '</div><table class="ans" style="margin-top:3mm"><tr class="tot"><td style="text-align:right;font-weight:800;font-size:11pt">TOTAL DE L\'ÉQUIPE</td><td class="ck" style="width:20mm"></td></tr></table></div>';
  };
  on("pAns", () => makePdf(["ans"], "feuilles-reponses"));
  on("pBlank", () => makePdf(["blank"], "feuille-reponses-vierge"));
  on("pKey", () => makePdf(["key"], "corrige"));
  on("pScore", () => makePdf(["score"], "tableau-scores"));
  on("pRules", () => makePdf(["rules"], "regles"));
  on("pAll", () => {
    const D = [["teams", "Feuilles d'équipe (1 page par équipe, QR code)", true], ["list", "Liste des équipes pour l'annonce", true], ["dj", "Fiche DJ + playlist", !!djUrl], ["rules", "Règles du jeu", true], ["key", "Corrigé pour l'animateur", true], ["score", "Tableau des scores", true], ["ans", "Plan B : feuilles de réponses (1 par équipe)", false], ["blank", "Plan B : feuille de réponses vierge", false]];
    openModal('<h3>📦 Tout en un PDF</h3><p class="muted small">Cochez les documents : vous obtenez un seul fichier PDF, prêt à imprimer, enregistrer ou envoyer.</p>' + D.map(([k, l, on]) => '<label class="row" style="margin:6px 0"><input type="checkbox" data-pk="' + k + '" style="width:auto"' + (on ? " checked" : "") + (k === "dj" && !djUrl ? " disabled" : "") + '><span style="flex:1">' + l + "</span></label>").join("") +
      '<div class="row end"><button class="btn ghost" id="paNo">Annuler</button><button class="btn" id="paOk">📄 Créer le PDF</button></div>', (b) => {
      $("#paNo", b).onclick = closeModal;
      $("#paOk", b).onclick = async () => { const k = $$("[data-pk]", b).filter((x) => x.checked).map((x) => x.dataset.pk); if (!k.length) return toast("Cochez au moins un document"); closeModal(); await makePdf(k, "complet", djUrl); };
    });
  });
}

/* ---- Onglet Réglages ---- */
function tabReglages(v) {
  const st = S.draft;
  v.innerHTML = '<div class="card keep"><h3>🏆 Palmarès</h3><p class="muted small">Les vainqueurs de chaque partie, gardés même après une remise à zéro. « 🖨 Affiche » refait l\'affiche A4 quand vous voulez.</p><div id="hofL"><p class="muted small">Chargement…</p></div></div>' + '<div class="card keep" id="savesCard"><h3>💾 Mes parties enregistrées</h3><p class="muted small">Préparez une partie (équipes + manches), enregistrez-la : elle restera figée jusqu\'au jour J. Vous pouvez en garder plusieurs et charger celle du soir.</p>' +
    (st.loadedFrom ? '<p>Partie actuelle : <b>' + esc(st.loadedFrom.name) + '</b></p>' : '') + durHtml(S.draft || st) +
    '<div class="row"><input id="svName" class="grow" style="flex:1" maxlength="60" placeholder="Nom de la partie (ex. Soirée amicale 2026)" value="' + esc(st.loadedFrom ? st.loadedFrom.name : st.name) + '"></div>' +
    '<div class="row">' + (st.loadedFrom ? '<button class="btn ok" id="svUpd">💾 Mettre à jour « ' + esc(st.loadedFrom.name) + ' »</button>' : '') + '<button class="btn ' + (st.loadedFrom ? 'ghost' : 'ok') + '" id="svNew">➕ Enregistrer comme nouvelle partie</button></div>' +
    '<div id="svList" class="muted small">Chargement…</div></div>' +
    '<div class="card keep"><h3>La soirée</h3><label class="f">Nom de la soirée</label><input id="rName" maxlength="60" value="' + esc(st.name) + '">' +
    '<label class="f">Adresse de l\'appli (pour les QR codes)</label><input id="rBase" placeholder="' + esc(location.origin) + '" value="' + esc(st.baseUrl || "") + '"><p class="muted small">Laissez vide pour utiliser l\'adresse actuelle.</p>' +
    '<label class="f">Mon service de musique (liens de secours)</label><select id="rSvc">' + [["", "Tous (Apple Music, Spotify, Deezer, YouTube)"], ["am", "🍎 Apple Music"], ["sp", "🟢 Spotify"], ["dz", "🟣 Deezer"], ["yt", "▶ YouTube"]].map(([k, l]) => '<option value="' + k + '"' + ((st.service || "") === k ? " selected" : "") + ">" + l + "</option>").join("") + '</select><p class="muted small">L\'appli joue elle-même les extraits, sans compte. Ce service sert de secours : son lien s\'affiche en premier chez le DJ.</p></div>' +
    '<div class="card keep"><h3>📺 Adresse de l\'écran géant</h3><p class="small">À taper sur l\'ordinateur branché au vidéoprojecteur (puis double-clic pour le plein écran) :</p><div class="url">' + esc(screenUrl().replace(/^https?:\/\//, "")) + '</div><div class="row"><button class="btn ghost sm" id="rCpSc">📋 Copier l\'adresse</button></div>' + (ESSAI ? '<p class="muted small">C\'est l\'adresse de l\'écran du mode essai. Le jour J : <b>' + esc((baseUrl() + "/ecran").replace(/^https?:\/\//, "")) + "</b></p>" : "") + '</div>' +
    '<div class="card keep"><h3>📺 Appli pour dongle Android TV</h3><p class="small">Pour brancher l\'écran géant sans PC : installez l\'appli « Blind test – Écran » sur le dongle du vidéoprojecteur (Android TV, Google TV, Fire TV). Elle s\'ouvre directement en plein écran.</p><div class="url">' + esc((baseUrl() + "/tv.apk").replace(/^https?:\/\//, "")) + '</div>' +
    '<details><summary class="small">Comment l\'installer ?</summary><ol class="pl small"><li>Sur le dongle, installez l\'appli gratuite <b>Downloader</b> (Play Store ou Amazon Appstore).</li><li>Autorisez-la à installer des applis : Paramètres → Applis → Sécurité / Sources inconnues → Downloader.</li><li>Dans Downloader, tapez l\'adresse ci-dessus, puis « Installer ».</li><li>L\'appli « Blind test – Écran » apparaît avec vos applis.</li></ol><p class="small">Télécommande : <b>OK</b> = recharger · <b>OK 5 fois</b> (ou Menu) = basculer vraie soirée / mode essai · <b>Retour 2 fois</b> = quitter.</p></details></div>' +
    '<div class="card keep"><h3>🧠 Morceaux déjà joués</h3><p class="small">' + plural(((S.data && S.data.played) || []).length, "morceau joué", "morceaux joués") + ' lors des parties précédentes. Au tirage au sort, l\'appli prend d\'abord des morceaux jamais joués.</p><button class="btn ghost" id="rPlayed">🧹 Oublier l\'historique</button></div>' +
    '<div class="card keep"><h3>Codes d\'accès</h3><div class="row"><span class="grow">Code animateur : <b>' + esc(st.codes.anim) + '</b></span><button class="btn ghost sm" id="rCA">Changer</button></div>' +
    '<div class="row"><span class="grow">Code DJ : <b>' + (st.codes.dj ? esc(st.codes.dj) : '<span style="color:var(--ko)">non défini</span>') + '</b></span><button class="btn ghost sm" id="rCD">' + (st.codes.dj ? "Changer" : "Définir") + "</button></div></div>" +
    '<div class="card keep"><h3>Noms d\'équipe</h3><label class="row"><input type="checkbox" id="rTN" style="width:auto"' + (st.teamNames !== false ? " checked" : "") + '> Les chefs d\'équipe choisissent leur nom sur leur téléphone (avant le début de la partie)</label><p class="muted small">Sinon, les noms tirés au sort (modifiables dans Équipes) sont gardés.</p></div>' +
    '<div class="card keep"><h3>Barème et chrono</h3><div class="row"><label class="grow">Points pour le titre<input type="number" id="rPT" min="0" max="10" value="' + st.scoring.title + '"></label><label class="grow">Points pour l\'artiste<input type="number" id="rPA" min="0" max="10" value="' + st.scoring.artist + "\"></label></div>" +
    '<div class="row"><label class="grow">Durée de l\'extrait (s)<input type="number" id="rEx" min="5" max="90" value="' + st.extractSec + '"></label><label class="grow">Silence pour écrire (s)<input type="number" id="rAn" min="3" max="90" value="' + st.answerSec + '"></label></div>' +
    (S.pub && S.pub.scoringLocked && (S.pub.scoring.title !== st.scoring.title || S.pub.scoring.artist !== st.scoring.artist) ? '<p class="small" style="color:#ff9f1a">🔒 La partie en cours garde son barème du lancement (titre ' + S.pub.scoring.title + " pt, artiste " + S.pub.scoring.artist + " pt) : ces nouveaux points s'appliqueront à la prochaine partie.</p>" : "") +
    '<p class="muted small">Titre et artiste trouvés = ' + (st.scoring.title + st.scoring.artist) + " points ; un seul des deux = " + st.scoring.title + " ou " + st.scoring.artist + " point(s). Les manches « ×2 » doublent les points. Les fautes de frappe sont tolérées.</p></div>" +
    '<div class="card"><h3>Réutiliser l\'appli</h3><p class="muted small">Sauvegardez vos manches et réglages dans un fichier pour une prochaine soirée.</p><div class="row"><button class="btn ghost keep" id="rExp">⬇️ Exporter la configuration</button><label class="btn ghost">📂 Importer une configuration<input type="file" id="rImp" accept=".json" hidden></label></div></div>' +
    '<div class="card keep"><h3>Partie</h3><div class="row"><button class="btn warn" id="rReset">🔄 Remettre la partie à zéro</button><button class="btn ko" id="rNew">🆕 Nouvelle soirée (vider les équipes)</button></div><p class="muted small">« Remettre à zéro » efface les réponses et les scores mais garde équipes et manches (idéal après une répétition).</p></div>' +
    '<div class="card keep"><button class="btn ghost" id="rReload">↻ Recharger depuis le serveur</button> <button class="btn ghost" id="rOut">🚪 Se déconnecter</button></div>';
  const partialSave = async (setup) => { try { await api("/setup", { method: "POST", body: { setup, partial: true } }); chip("✓ Enregistré", "ok"); pollNow(); } catch (e) { chip("⚠️ " + e.message, "ko"); } };
  let t1 = null;
  const deb = (fn) => { clearTimeout(t1); chip("Enregistrement…"); t1 = setTimeout(fn, 700); };
  $("#rName").oninput = (e) => { st.name = e.target.value; deb(() => partialSave({ name: st.name })); };
  $("#rCpSc").onclick = () => copyText(screenUrl());
  $("#rSvc").onchange = (e) => { st.service = e.target.value; partialSave({ service: st.service }); };
  $("#rPlayed").onclick = async () => { if (await confirmBox("Oublier la liste des morceaux déjà joués ? Ils pourront de nouveau être tirés au sort.", "Oublier")) { try { await api("/played/reset", { method: "POST" }); toast("Historique effacé"); S.data.played = []; tabReglages(v); } catch (e) { toast(e.message); } } };
  $("#rBase").oninput = (e) => { st.baseUrl = e.target.value.trim(); deb(() => partialSave({ baseUrl: st.baseUrl })); };
  const num = (id, fn) => ($("#" + id).onchange = (e) => { fn(Number(e.target.value)); partialSave({ scoring: st.scoring, extractSec: st.extractSec, answerSec: st.answerSec }); });
  num("rPT", (x) => (st.scoring.title = Math.max(0, Math.min(10, x || 0))));
  num("rPA", (x) => (st.scoring.artist = Math.max(0, Math.min(10, x || 0))));
  num("rEx", (x) => (st.extractSec = Math.max(5, Math.min(90, x || 10))));
  num("rAn", (x) => (st.answerSec = Math.max(3, Math.min(90, x || 10))));
  $("#rTN").onchange = (e) => { st.teamNames = e.target.checked; partialSave({ teamNames: st.teamNames }); };
  const setCode = async (kind) => {
    const c = await ask(kind === "anim" ? "Nouveau code animateur" : "Code du DJ", { numeric: true, type: "tel", help: "3 à 12 caractères (4 chiffres conseillés). Notez-le bien !" });
    if (c == null) return; if (c.length < 3) return toast("3 caractères minimum");
    if (kind === "anim" && c === st.codes.dj) return toast("Le code animateur doit être différent du code DJ");
    if (kind === "dj" && c === st.codes.anim) return toast("Le code DJ doit être différent du code animateur");
    const codes = Object.assign({}, st.codes); codes[kind] = c;
    try {
      await api("/setup", { method: "POST", body: { setup: { codes }, partial: true } });
      st.codes = codes; if (kind === "anim") { S.sess.code = c; LS.set("bt_sess", S.sess); }
      toast("Code enregistré ✓"); tabReglages(v); pollNow();
    } catch (e) { toast(e.message); }
  };
  $("#rCA").onclick = () => setCode("anim"); $("#rCD").onclick = () => setCode("dj");
  $("#rExp").onclick = () => {
    const cfg = { app: "blindtest", v: 1, name: st.name, scoring: st.scoring, extractSec: st.extractSec, answerSec: st.answerSec, manches: st.manches, teams: st.teams };
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(cfg, null, 1)], { type: "application/json" })); a.download = "blind-test-config.json"; a.click();
  };
  $("#rImp").onchange = (e) => {
    const f = e.target.files[0]; if (!f) return; const fr = new FileReader();
    fr.onload = async () => {
      try {
        const c = JSON.parse(fr.result); if (c.app !== "blindtest" || !Array.isArray(c.manches)) throw 0;
        const withTeams = Array.isArray(c.teams) && c.teams.length && (await confirmBox("Importer aussi les " + c.teams.length + " équipes de ce fichier ?", "Oui, avec les équipes"));
        Object.assign(st, { name: c.name || st.name, scoring: c.scoring || st.scoring, extractSec: c.extractSec || st.extractSec, answerSec: c.answerSec || st.answerSec, manches: c.manches });
        if (withTeams) st.teams = c.teams;
        saveDraft(true); toast("Configuration importée ✓"); tabReglages(v);
      } catch (x) { toast("Fichier de configuration invalide"); }
    };
    fr.readAsText(f); e.target.value = "";
  };
  $("#rReset").onclick = async () => { if (await confirmBox("Remettre la partie à zéro ? Les réponses et les scores seront effacés. Les équipes et les manches sont conservées.", "Remettre à zéro", true)) { try { await api("/reset", { method: "POST", body: { mode: "game" } }); toast("Partie remise à zéro"); S.lastSig = ""; pollNow(); } catch (e) { toast(e.message); } } };
  $("#rNew").onclick = async () => { if (await confirmBox("Nouvelle soirée ? Les équipes, réponses et scores seront effacés. Les manches et les codes sont conservés.", "Nouvelle soirée", true)) { try { await api("/reset", { method: "POST", body: { mode: "soiree" } }); S.draft.teams = []; S.people = null; LS.del("bt_people"); toast("Nouvelle soirée prête"); pollNow(); tabReglages(v); } catch (e) { toast(e.message); } } };
  loadSaves(v);
  const doSave = async (id) => {
    const name = $("#svName").value.trim();
    if (!name) return toast("Donnez un nom à la partie");
    clearTimeout(sdT);
    try { await api("/setup", { method: "POST", body: { setup: S.draft, partial: isLocked() } }); await api("/saves", { method: "POST", body: { name, id } }); toast("💾 Partie « " + name + " » enregistrée"); S.draft = null; pollNow(); setTimeout(() => { if (S.tab === "reglages") renderTab(); }, 900); }
    catch (e) { toast(e.message, 3500); }
  };
  $("#svNew").onclick = () => doSave(null);
  if ($("#svUpd")) $("#svUpd").onclick = () => doSave(st.loadedFrom.id);
  $("#rReload").onclick = () => { S.draft = null; S.lastSig = ""; pollNow(); toast("Rechargé"); };
  $("#rOut").onclick = async () => { if (await confirmBox("Se déconnecter de ce téléphone ? (Gardez votre code animateur !)", "Se déconnecter")) logout(); };
  lockInputs(v);
  hofCard(v);
}

async function loadSaves(v) {
  const box = $("#svList", v); if (!box) return;
  try {
    const r = await api("/saves");
    if (!r.saves.length) { box.innerHTML = "Aucune partie enregistrée pour l'instant."; return; }
    const d = (t) => new Date(t).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    box.innerHTML = r.saves.map((x) => '<div class="tcard"><b>' + esc(x.name) + (r.current && r.current.id === x.id ? ' <span class="chip ok">chargée</span>' : '') + '</b><div class="muted small">' + plural(x.teams, "équipe") + " · " + plural(x.manches, "manche") + " · " + plural(x.songs, "morceau", "morceaux") + (x.min ? " · ⏱ ≈ " + fmtMin(x.min) : "") + " · enregistrée le " + d(x.savedAt) + '</div><div class="row"><button class="btn alt sm" data-ld="' + x.id + '">📂 Charger</button><button class="btn ghost sm" data-dl="' + x.id + '">🗑 Supprimer</button></div></div>').join("");
    $$("[data-ld]", box).forEach((b) => (b.onclick = async () => {
      const x = r.saves.find((y) => y.id === b.dataset.ld);
      if (!(await confirmBox("Charger « " + esc(x.name) + " » ? Les équipes et manches actuelles seront remplacées (pensez à enregistrer avant si besoin). Les scores sont remis à zéro.", "Charger"))) return;
      try { await api("/saves/load", { method: "POST", body: { id: x.id } }); S.draft = null; S.lastSig = ""; toast("📂 « " + x.name + " » chargée"); pollNow(); setTimeout(() => renderTab(), 900); } catch (e) { toast(e.message, 3500); }
    }));
    $$("[data-dl]", box).forEach((b) => (b.onclick = async () => {
      const x = r.saves.find((y) => y.id === b.dataset.dl);
      if (!(await confirmBox("Supprimer définitivement « " + esc(x.name) + " » ?", "Supprimer", true))) return;
      try { await api("/saves/delete", { method: "POST", body: { id: x.id } }); toast("Partie supprimée"); loadSaves(v); } catch (e) { toast(e.message); }
    }));
  } catch (e) { box.textContent = "Impossible de charger la liste : " + e.message; }
}
