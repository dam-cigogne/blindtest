<style>
:root{--bg:#140c29;--bg2:#1f1540;--card:#2a1d55;--line:#43347a;--tx:#f4f1ff;--mu:#b6acd9;--pri:#ff4fa3;--pri2:#ff7bbd;--alt:#5b8cff;--ok:#2ecc8f;--ko:#ff5a5a;--warn:#ffb238;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
h1{font-size:1.7rem;margin:.2em 0}h2{font-size:1.2rem;margin:1.2em 0 .5em}h3{margin:.1em 0 .6em;font-size:1.08rem}
.muted{color:var(--mu)}.small{font-size:.85rem}.center{text-align:center}.pad{padding:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font-size:1rem;font-weight:600;color:#fff;background:var(--pri);cursor:pointer;min-height:46px;text-decoration:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:var(--alt)}.btn.ok{background:var(--ok);color:#06281b}.btn.ko{background:var(--ko)}.btn.warn{background:var(--warn);color:#2b1a00}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--tx)}
.btn.big{width:100%;font-size:1.15rem;padding:16px;min-height:58px}
.btn.sm{padding:6px 10px;min-height:34px;font-size:.9rem;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row.end{justify-content:flex-end}.row>.grow{flex:1}
input,select,textarea{width:100%;background:var(--bg2);color:var(--tx);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri2)}
input:disabled,select:disabled,textarea:disabled{opacity:.6}
label.f{display:block;margin:10px 0 4px;color:var(--mu);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.wrap{max-width:820px;margin:0 auto;padding:0 12px 40px}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(20,12,41,.96);border-bottom:1px solid var(--line)}
.top .tt{display:flex;flex-direction:column;min-width:0}.top .tt small{color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);font-size:.8rem;color:var(--mu);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.ko{color:var(--ko);border-color:var(--ko)}.chip.warn{color:var(--warn);border-color:var(--warn)}
.tabs{position:sticky;top:60px;z-index:4;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--bg2);color:var(--tx);border-radius:99px;padding:8px 13px;font-size:.92rem;font-weight:600}
.tabs button.on{background:var(--pri);border-color:var(--pri)}
.home{max-width:560px;margin:0 auto;padding:28px 16px 40px;text-align:center}
.home .logo{font-size:3.4rem}.roles{display:grid;gap:10px;margin:18px 0}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tbtn{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;gap:2px;font-size:.95rem}
.tbtn span{color:var(--mu);font-size:.85rem}
.banner{margin:12px;padding:14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;text-align:center}
.banner b{font-size:1.05rem}.banner span{font-size:1.25rem;font-weight:700}
.banner.play{background:#123d2e;border-color:var(--ok)}.banner.write{background:#4a1630;border-color:var(--pri)}
.arow{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;margin:8px 12px;background:var(--card);border:1.5px solid var(--line)}

.ains{flex:1;display:grid;gap:6px}
.res{margin:6px 12px}.res li{margin:4px 0}
.timer{margin:12px 0;padding:18px;border-radius:var(--r);text-align:center;font-size:1.5rem;font-weight:800;background:var(--bg2);border:2px solid var(--line)}
.timer.play{background:#0f3d2c;border-color:var(--ok)}.timer.write{background:#4d0f1f;border-color:var(--ko)}.timer.done{border-color:var(--alt)}
.song .st{font-size:1.45rem;font-weight:800}.song .sa{font-size:1.1rem;color:var(--pri2);font-weight:700}.song .sh{color:var(--mu);margin-top:4px}
.links{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.dzchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.dzchips button{background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:16px;padding:5px 10px;font-size:13px}
.links a{flex:1;text-align:center;padding:10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);color:var(--tx);text-decoration:none;font-weight:600;min-width:120px}
ol.pl{padding-left:22px;margin:6px 0}ol.pl li{margin:5px 0}ol.pl li.done{opacity:.45}ol.pl li.cur{color:var(--pri2);font-weight:700}
.rank{width:100%;border-collapse:collapse}.rank td,.rank th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:.95rem}.rank th{color:var(--mu);font-weight:600;font-size:.82rem}
.rank td.n{text-align:right;font-variant-numeric:tabular-nums}.rank input{width:70px;padding:6px}
.rev{padding:10px;border-radius:12px;background:var(--bg2);border:1px solid var(--warn);margin:8px 0}
.rev .ty{font-size:1.05rem;font-weight:700;margin:3px 0}
.badge{display:inline-block;min-width:28px;padding:2px 8px;border-radius:8px;font-weight:700;font-size:.85rem;border:0;cursor:pointer}
.badge.ok{background:var(--ok);color:#06281b}.badge.ko{background:var(--ko);color:#fff}.badge.doubt{background:var(--warn);color:#2b1a00}
.ansgrid{width:100%;border-collapse:collapse;font-size:.88rem}.ansgrid td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.imptab{border-collapse:collapse;font-size:12px;min-width:100%}.imptab td,.imptab th{border:1px solid var(--line);padding:4px 6px;white-space:nowrap;text-align:left}.imptab th{color:var(--mu);font-weight:600}.imptab tr.h td{background:var(--pri);color:#fff;font-weight:700}
.impl{max-height:45vh;overflow:auto;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--card)}
.impr{display:flex;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);font-size:14px}.impr input{width:auto;flex:none}.impr .grow{flex:1;min-width:0}.impr.junk .grow{text-decoration:line-through;opacity:.6}
.tcard{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.tcard .hd{display:flex;gap:8px;align-items:center}.tcard .hd input{flex:1;padding:8px}
.mems{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mem{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:99px;padding:6px 11px;font-size:.88rem}
.mcard{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}
.mcard .mh{display:flex;justify-content:space-between;align-items:center}
.trim{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:6px}
.tbar{position:relative;height:34px;background:var(--bg2);border-radius:8px;margin:4px 0 22px;cursor:pointer}
.tbar .tsel{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,var(--pri),var(--alt));border-radius:8px;opacity:.85}
.tbar .tcur{position:absolute;top:-4px;bottom:-4px;width:3px;background:#fff;border-radius:2px;display:none}
.tbar .t0,.tbar .t30{position:absolute;top:38px;font-size:11px;color:var(--mu)}.tbar .t30{right:0}
.trow{display:flex;align-items:center;gap:10px;margin:6px 0}.trow span{width:52px;color:var(--mu);font-size:.9rem}.trow b{min-width:44px;text-align:center}.trow .btn{width:40px;padding:6px 0}
.srow2{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.srow2 .sn{flex:0 0 16px;font-weight:800;color:var(--mu);font-size:.9rem;text-align:center}
.srow2 .cvw{position:relative;width:50px;height:50px;flex:none;border-radius:9px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:20px}
.srow2 .cvw img{width:100%;height:100%;object-fit:cover;border-radius:9px}
.srow2 .stb{position:absolute;right:-5px;bottom:-5px;font-size:12px;line-height:1;background:var(--bg);border-radius:99px;padding:2px}.srow2 .stb.b{color:var(--ko);font-weight:900}
.srow2 .tx{flex:1;min-width:0;cursor:pointer}.srow2 .tt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow2 .ta{color:var(--pri2);font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.srow2 .th{color:var(--mu);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow2 .pl{width:44px;height:44px;border-radius:50%;background:var(--pri);color:#fff;border:0;font-size:17px;flex:none;padding:0}.srow2 .pl.on{background:var(--ok)}
.srow2 .ed{width:38px;height:38px;border-radius:10px;background:none;border:1px solid var(--line);color:var(--tx);flex:none;padding:0;font-size:15px}
.srow{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.srow .sn{flex:0 0 22px;font-weight:800;color:var(--mu);padding-top:10px}.srow .sf{flex:1;display:grid;gap:6px}
.srow .sf input{padding:8px 10px}.srow details summary{color:var(--mu);font-size:.85rem;cursor:pointer}
.x{background:transparent;border:1px solid var(--line);color:var(--ko);border-radius:9px;width:36px;height:36px;font-size:1rem}
.qrbox{background:#fff;border-radius:12px;padding:10px;width:200px;max-width:100%;margin:8px auto}
.qrbox svg{width:100%;height:auto;display:block}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.qrgrid .it{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:.85rem}
.qrgrid .it .qrbox{width:110px;padding:6px}
.check{list-style:none;padding:0;margin:0 0 12px}.check li{padding:6px 0;color:var(--ko)}.check li.ok{color:var(--ok)}
.lock{background:#3d2a00;border:1px solid var(--warn);color:var(--warn);padding:10px;border-radius:12px;margin:12px 0}
#modal{position:fixed;inset:0;z-index:50;background:rgba(5,2,15,.72);display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:480px;max-height:88vh;overflow:auto}
.mbox .list{display:grid;gap:6px;margin:10px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#000;color:#fff;padding:12px 18px;border-radius:12px;z-index:60;transition:transform .25s;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
#net{position:fixed;top:6px;right:6px;z-index:70;width:12px;height:12px;border-radius:50%;background:var(--ko);display:none}
#net.off{display:block}
.scr{min-height:100vh;display:flex;flex-direction:column;padding:2vw 3.5vw;gap:2vw;text-align:center}
.scr .tone{display:flex;flex-direction:column;align-items:center;text-align:center;flex:1}
.scr .tone .tid{font-size:min(4vw,7vh);font-weight:900;color:var(--pri2)}.scr .tone .tid span{font-size:.45em;color:var(--mu);font-weight:700;margin-left:.6em}
.scr .tone .tnm{font-size:min(6vw,10vh);font-weight:900;line-height:1.05;margin:.1em 0 .35em}
.scr .tone .tmem{list-style:none;margin:0;padding:0;column-gap:5vw;text-align:left;width:92vw;max-width:92vw}.scr .tone .tmem li{break-inside:avoid;line-height:1.3;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scr .tteams{display:grid;gap:1vw;text-align:left;align-content:start}
.scr .tteams>div{background:var(--card);border:1px solid var(--line);border-radius:1vw;padding:.5em .7em;min-width:0}
.scr .tteams h4{margin:0 0 .25em;color:var(--pri2);font-size:1.15em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scr .tteams li{list-style:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}.scr .tteams ul{margin:0;padding:0}
.steps{counter-reset:st;margin:0;padding:0}.steps>div{display:flex;gap:10px;align-items:flex-start;margin:10px 0}.steps .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}.steps .b{flex:1}
.url{word-break:break-all;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:ui-monospace,monospace;font-size:13px}
.scr .qall{display:grid;gap:1.2vw;justify-content:center;align-content:start}
.scr .qall>div{background:#fff;color:#111;border-radius:1vw;padding:.6vw;text-align:center;font-weight:800;min-width:0}
.scr .qall svg,.scr .qone svg{display:block;width:100%;height:auto}
.scr .qall .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.scr .qone{display:flex;gap:4vw;align-items:center;justify-content:center;flex:1}
.scr .qone .qq{background:#fff;padding:1.2vh;border-radius:1.5vh;width:min(62vh,46vw)}
.scr .qone .tx{text-align:left;max-width:44vw}
.scr .qone .n{font-size:min(5vw,9vh);font-weight:900;color:var(--pri2)}.scr .qone .nm2{font-size:min(4vw,7vh);font-weight:800;line-height:1.1}
.scr .qone .hint{font-size:min(2vw,3.6vh);color:var(--mu);margin-top:2vh}.scr .qone .pos{font-size:min(1.8vw,3vh);color:var(--mu);margin-top:1vh}
.qnav{display:flex;gap:8px;align-items:center}.qnav .grow{flex:1;text-align:center;font-weight:800}
.qpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:8px}.qpick button{background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px 4px;font-weight:700}.qpick button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.scr .nm{font-size:3vw;color:var(--mu);font-weight:700}
.scr .big{font-size:6vw;font-weight:900;line-height:1.1}
.scr .mid{font-size:3.2vw;font-weight:700}
.scr .ph{font-size:5vw;font-weight:900;padding:2vw;border-radius:2vw;background:var(--bg2);border:.3vw solid var(--line)}
.scr .ph.play{background:#0f3d2c;border-color:var(--ok)}.scr .ph.write{background:#4d0f1f;border-color:var(--pri)}
.scr .bar{height:1.4vw;background:var(--bg2);border-radius:1vw;overflow:hidden}.scr .bar i{display:block;height:100%;background:var(--pri);transition:width .25s linear}
.scr .tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(22vw,1fr));gap:1vw;font-size:1.8vw}
.scr .tl div{background:var(--card);border-radius:1vw;padding:1vw}
.scr .reveal{font-size:2.4vw;text-align:left;max-width:80vw;margin:0 auto}.scr .reveal li{margin:.6vw 0}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:2vw;margin-top:2vw}
.podium>div{background:var(--card);border-radius:1.5vw 1.5vw 0 0;width:24vw;padding:1.5vw;font-size:2.4vw;font-weight:800;animation:up .9s ease both}
.podium .p1{height:30vw;background:linear-gradient(#ffcf4a,#b8860b);color:#2b1a00}.podium .p2{height:23vw;background:linear-gradient(#e6e6f0,#8d8da8);color:#1b1b2b}.podium .p3{height:18vw;background:linear-gradient(#e8a56b,#8b4a1c)}
.podium .medal{font-size:5vw}
@keyframes up{from{transform:translateY(40vw);opacity:0}to{transform:none;opacity:1}}
.rules{font-size:1.08rem;line-height:1.55}.rules h3{font-size:1.25rem}.rules ol{padding-left:22px}.rules li{margin:10px 0}.rules .pts{width:100%;border-collapse:collapse;margin:8px 0}.rules .pts td{padding:6px 8px;border-bottom:1px solid var(--line)}.rules .pts td.n{text-align:right;font-weight:800;color:var(--pri2);white-space:nowrap}
.scr .rules{font-size:min(1.6vw,2.6vh);line-height:1.4;text-align:left;max-width:90vw;margin:0 auto}.scr .rules h3{font-size:min(2.6vw,4.2vh);margin:0 0 .4em}.scr .rules li{margin:.35em 0}.scr .rules .pts{width:60%}.scr .rules .pts td{padding:.15em .5em}.scr .rules p{margin:.4em 0}.scr .rules .say{display:none}
#printRoot{display:none}
body.essai::after{content:"";position:fixed;inset:0;border:4px solid #ff9f1a;pointer-events:none;z-index:99}
#essaiBar{background:#ff9f1a;color:#2b1a00;font-weight:700;font-size:14px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#essaiBar button{background:#2b1a00;color:#fff;border:0;border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px}
body.essai .top{padding-top:10px}
.pv{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px;margin:8px 0}
.pv img{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none;background:#000}
.pv .pt{flex:1;min-width:0;font-size:14px}.pv .pt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv.bad{border-color:var(--ko)}.pv.warn{border-color:#ff9f1a}
.pvrow{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.pvrow img{width:40px;height:40px;border-radius:6px;object-fit:cover;flex:none}.pvrow .pt{flex:1;min-width:0}
.pvrow .src{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--bg2);border:1px solid var(--line)}
.srow .pvb{background:none;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:2px 6px;font-size:15px;margin-top:4px}
@media print{
  @page{size:A4;margin:12mm}
  html,body.printing{background:#fff!important;color:#000!important;min-height:0!important;padding:0!important}
  .sheet .rules,.sheet .rules li{text-align:left}.sheet .rules .pts{width:70%}.sheet .rules .pts td.n{color:#000}
  body.printing>*:not(#printRoot){display:none!important}
  body.printing.essai::after{display:none}
  body.printing #printRoot{display:block}
  body.printing #printRoot{width:186mm}.sheet{width:186mm;box-sizing:border-box;margin:0 auto}
  .sheet{break-after:page;page-break-after:always;color:#000;font-family:Arial,sans-serif;text-align:center}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  .sheet .ev{font-size:14pt;color:#555}.sheet .tn{font-size:40pt;font-weight:900;margin:4mm 0 0}.sheet .tname{font-size:24pt;font-weight:700;margin-bottom:6mm}
  .sheet .q{width:85mm;margin:0 auto}.sheet .q svg{width:100%;height:auto}
  .sheet .how{font-size:13pt;margin:4mm 0}.sheet .code{font-size:16pt;border:2px dashed #000;display:inline-block;padding:3mm 6mm;margin:2mm 0 6mm}
  .sheet ul{list-style:none;padding:0;margin:0;font-size:14pt;columns:2}.sheet li{padding:1mm 0}
  .sheet table{width:100%;border-collapse:collapse;text-align:left;font-size:11pt}.sheet td,.sheet th{border:1px solid #999;padding:2mm}
  .sheet h2{margin:2mm 0}.sheet .left{text-align:left}
  .pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:3mm 5mm}.pgrid .pb{min-width:0}.sheet table{box-sizing:border-box}.pb .ph2 span:first-child{overflow:hidden;text-overflow:ellipsis}
  .pb{break-inside:avoid;page-break-inside:avoid;margin:0;text-align:left}
  .pb .ph2{display:flex;justify-content:space-between;font-size:9.5pt;font-weight:700;border-bottom:1.5px solid #000;padding:.5mm 0;white-space:nowrap;overflow:hidden}
  .sheet table.ans{table-layout:fixed}.sheet table.ans td,.sheet table.ans th{padding:.6mm 1.2mm;overflow:hidden}
  .sheet table.ans td{height:7.2mm;font-size:8.5pt}.sheet table.ans td.no{width:5mm;text-align:center;font-weight:700}.sheet table.ans td.ck,.sheet table.ans th.ck{width:9mm}.sheet table.ans th.no{width:5mm}
  .sheet table.ans.key td{height:auto;padding:1mm 1.2mm}
  .sheet table.ans th{font-size:8pt;background:#eee;text-align:left}
  .sheet .tot td{height:6mm;font-size:8pt}
  .sheet h2.c{margin:0 0 1mm;font-size:16pt}.sheet .ev.c{font-size:10pt}
  .sheet table.sc td{height:9mm;text-align:center}.sheet table.sc td:nth-child(2){text-align:left}
  .sheet .hint{font-size:9pt;color:#444;margin:1mm 0 3mm}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="net" title="Connexion perdue"></div>
<div id="printRoot"></div>
<script src="library.js"></script>
<script src="qrcode.js"></script>
<script src="xlsx.mini.min.js" defer></script>
<script>
"use strict";
/* ================= Outils ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/* Mode essai : une partie séparée sur le serveur, rien ne touche la vraie soirée */
const ESSAI = (() => {
  try {
    const q = new URLSearchParams(location.search);
    if (q.has("essai")) localStorage.setItem("bt_essai", q.get("essai") === "0" ? "0" : "1");
    else if (q.get("t") || q.get("r")) localStorage.setItem("bt_essai", "0"); // un vrai QR code ramène toujours à la vraie soirée
    return localStorage.getItem("bt_essai") === "1";
  } catch (e) { return false; }
})();
const ESSAI_Q = ESSAI ? "&essai=1" : "";
function setEssai(on) { try { localStorage.setItem("bt_essai", on ? "1" : "0"); } catch (e) {} location.href = location.pathname; }
const lk = (k) => (ESSAI ? "essai_" : "") + k;
const LS = {
  get(k, d) { try { const v = localStorage.getItem(lk(k)); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(lk(k), JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(lk(k)); } catch (e) {} },
};
const clone = (o) => JSON.parse(JSON.stringify(o));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const plural = (n, s, p) => n + " " + (n > 1 ? (p || s + "s") : s);
const ord = (n) => n + (n === 1 ? "er" : "e");

const S = {
  sess: LS.get("bt_sess", null),
  pub: null, data: null, offset: 0,
  built: null, lastSig: "",
  tab: LS.get("bt_tab", "jeu"),
  draft: null, people: LS.get("bt_people", null), imp: null,
  djTab: "live", tick: null, fails: 0,
};

/* Liens directs (QR codes) */
(function () {
  const q = new URLSearchParams(location.search);
  let s = null;
  if (q.get("t") && q.get("c")) s = { role: "team", teamId: Number(q.get("t")), code: q.get("c") };
  else if (q.get("r") === "screen") s = { role: "screen" };
  else if ((q.get("r") === "dj" || q.get("r") === "anim") && q.get("c")) s = { role: q.get("r"), code: q.get("c") };
  if (q.has("reset")) { ["bt_sess", "bt_combo", "bt_tab"].forEach(LS.del); S.sess = null; S.tab = "jeu"; }
  else if (s) { S.sess = s; LS.set("bt_sess", s); }
  if (q.toString()) history.replaceState(null, "", location.pathname);
})();

function toast(msg, ms) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), ms || 2600);
}
function openModal(html, onMount) {
  const m = $("#modal"); m.innerHTML = '<div class="mbox">' + html + "</div>"; m.classList.add("show");
  m.onclick = (e) => { if (e.target === m) closeModal(); };
  if (onMount) onMount(m.firstElementChild);
}
function closeModal() { const m = $("#modal"); m.classList.remove("show"); m.innerHTML = ""; }
function ask(title, o) {
  o = o || {};
  return new Promise((res) => {
    openModal("<h3>" + esc(title) + "</h3>" + (o.help ? '<p class="muted">' + o.help + "</p>" : "") +
      '<input id="askIn" type="' + (o.type || "text") + '" ' + (o.numeric ? 'inputmode="numeric" pattern="[0-9]*"' : "") +
      ' placeholder="' + esc(o.placeholder || "") + '" value="' + esc(o.value || "") + '" autocomplete="off" autocapitalize="' + (o.upper ? "characters" : "off") + '">' +
      '<div class="row end"><button class="btn ghost" id="askNo">Annuler</button><button class="btn" id="askOk">' + esc(o.ok || "Valider") + "</button></div>", (box) => {
      const i = $("#askIn", box); setTimeout(() => i.focus(), 60);
      let done = false;
      const fin = (v) => { if (done) return; done = true; closeModal(); res(v); };
      $("#askNo", box).onclick = () => fin(null);
      $("#askOk", box).onclick = () => fin(i.value.trim());
      i.onkeydown = (e) => { if (e.key === "Enter") fin(i.value.trim()); };
    });
  });
}
function confirmBox(text, ok, danger) {
  return new Promise((res) => {
    openModal("<p>" + text + '</p><div class="row end"><button class="btn ghost" id="cNo">Annuler</button><button class="btn ' + (danger ? "ko" : "") + '" id="cOk">' + esc(ok || "Confirmer") + "</button></div>", (box) => {
      $("#cNo", box).onclick = () => { closeModal(); res(false); };
      $("#cOk", box).onclick = () => { closeModal(); res(true); };
    });
  });
}
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); toast("Copié ✓"); }
  catch (e) {
    openModal('<h3>Copier le texte</h3><textarea rows="12" id="cpT">' + esc(txt) + '</textarea><div class="row end"><button class="btn" id="cpOk">Fermer</button></div>', (b) => {
      const t = $("#cpT", b); t.focus(); t.select(); $("#cpOk", b).onclick = closeModal;
    });
  }
}

/* ================= Réseau ================= */
async function api(path, opt) {
  opt = opt || {};
  const s = S.sess || {};
  const r = await fetch("/api" + path, {
    method: opt.method || "GET", cache: "no-store",
    headers: { "content-type": "application/json", "x-essai": ESSAI ? "1" : "", "x-role": s.role || "", "x-code": s.code || "", "x-team": String(s.teamId || "") },
    body: opt.body ? JSON.stringify(opt.body) : undefined,
  });
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const er = new Error(j.error || "Erreur " + r.status); er.status = r.status; throw er; }
  return j;
}
let pollT = null, polling = false, again = false;
function interval() {
  const r = S.sess && S.sess.role, p = S.pub;
  if (document.hidden && r !== "screen") return 15000;
  if (!p || p.status !== "running") return r === "anim" ? 2500 : 4000;
  if (sonoOn()) return 700; // la sono doit réagir vite quand l'animateur lance l'extrait
  return r === "team" ? 2500 : 1500;
}
async function poll() {
  clearTimeout(pollT);
  if (polling) { again = true; return; }
  polling = true;
  const r = S.sess && S.sess.role;
  const ep = r === "anim" ? "/anim" : r === "dj" ? "/dj" : r === "team" ? "/team" : "/public";
  try {
    const d = await api(ep);
    S.fails = 0; S.data = d; S.pub = d.pub; S.offset = d.pub.now - Date.now();
    $("#net").classList.remove("off");
    onData();
  } catch (e) {
    if (e.status === 401) {
      S.fails++;
      if (S.fails >= 2) { toast("Code invalide ou équipe supprimée: reconnectez-vous", 4000); logout(); }
    } else { $("#net").classList.add("off"); }
  } finally {
    polling = false;
    if (again) { again = false; pollT = setTimeout(poll, 50); } else pollT = setTimeout(poll, interval());
  }
}
function pollNow() { clearTimeout(pollT); poll(); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) { pollNow(); wake(); } });
let wl = null;
async function wake() { try { if ("wakeLock" in navigator && S.sess && !wl) { wl = await navigator.wakeLock.request("screen"); wl.addEventListener("release", () => { wl = null; }); } } catch (e) {} }

async function login(role, code, teamId) {
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json", "x-essai": ESSAI ? "1" : "" }, body: JSON.stringify({ role, code, teamId }) }).then((x) => x.json());
    if (!r.ok) { toast("Code incorrect"); return false; }
    S.sess = { role, code, teamId: teamId || 0 }; LS.set("bt_sess", S.sess);
    S.data = null; S.draft = null; S.lastSig = ""; render(); pollNow(); wake();
    return true;
  } catch (e) { toast("Pas de connexion internet"); return false; }
}
function logout() {
  S.sess = null; LS.del("bt_sess"); LS.del("bt_combo"); LS.del("bt_tab"); S.tab = "jeu"; S.data = null; S.draft = null; S.lastSig = ""; S.fails = 0;
  render(); pollNow();
}

/* ================= Temps / phases ================= */
function phase(p) {
  p = p || S.pub;
  if (!p || !p.started) return { ph: "idle", left: 0, frac: 0 };
  const el = (Date.now() + S.offset - p.phaseStart) / 1000;
  const tot = p.extractSec + p.answerSec;
  if (el < p.extractSec) return { ph: "play", left: Math.max(1, Math.ceil(p.extractSec - el)), frac: el / tot };
  if (el < tot) return { ph: "write", left: Math.max(1, Math.ceil(tot - el)), frac: el / tot };
  return { ph: "done", left: 0, frac: 1 };
}
setInterval(() => { if (S.tick) { try { S.tick(); } catch (e) {} } }, 250);

/* ================= QR / impression ================= */
function qrSvg(text) {
  const q = qrcode(0, "M"); q.addData(text); q.make();
  const n = q.getModuleCount(); let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += "M" + (c + 2) + "," + (r + 2) + "h1v1h-1z";
  return '<svg viewBox="0 0 ' + (n + 4) + " " + (n + 4) + '" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
}
function baseUrl() { return ((S.draft && S.draft.baseUrl) || location.origin).replace(/\/+$/, ""); }
function screenUrl() { return baseUrl() + (ESSAI ? "/ecran-essai" : "/ecran"); }
function teamUrl(t) { return baseUrl() + "/?t=" + t.id + "&c=" + encodeURIComponent(t.code) + ESSAI_Q; }
function doPrint(html) {
  const root = $("#printRoot"); root.innerHTML = html;
  document.body.classList.add("printing");
  const clean = () => { document.body.classList.remove("printing"); root.innerHTML = ""; window.removeEventListener("afterprint", clean); };
  window.addEventListener("afterprint", clean);
  setTimeout(() => window.print(), 150);
}

/* ================= Rendu principal ================= */
function render() {
  S.tick = null; S.lastSig = "";
  const r = S.sess && S.sess.role;
  const app = $("#app");
  if (!r) return renderHome(app);
  if (r === "team") return buildTeam(app);
  if (r === "dj") return renderDJ(app);
  if (r === "screen") return renderScreen(app);
  if (r === "anim") return renderAnim(app);
}
function onData() {
  const r = (S.sess && S.sess.role) || "home";
  if (S.built !== r) return render();
  if (r === "home") renderHome($("#app"));
  else if (r === "team") updTeam();
  else if (r === "dj") renderDJ($("#app"));
  else if (r === "screen") renderScreen($("#app"));
  else if (r === "anim") updAnim();
  sonoSync();
}

/* ================= Accueil ================= */
function renderHome(app) {
  const p = S.pub;
  const sig = JSON.stringify(p ? [p.name, p.teams.map((t) => [t.id, t.name]), p.needInit, p.djReady] : null);
  if (S.built === "home" && S.lastSig === sig) return;
  S.built = "home"; S.lastSig = sig;
  app.innerHTML = '<div class="home"><div class="logo">🎵</div><h1>' + esc(p ? p.name : "Blind test") + '</h1><p class="muted">Choisissez votre rôle</p>' +
    '<div class="roles"><button class="btn big" data-r="anim">🎤 Je suis l\'animateur</button>' +
    '<button class="btn big alt" data-r="dj">🎧 Je suis le DJ</button>' +
    '<button class="btn big" style="background:linear-gradient(90deg,var(--pri),var(--alt))" data-r="combo">🎤🎧 Je suis l\'animateur et le DJ</button>' +
    '<button class="btn big ghost" data-r="screen">📺 Écran géant</button></div>' +
    "<h2>Je suis une équipe</h2>" +
    (p && p.teams.length
      ? '<div class="teamgrid">' + p.teams.map((t) => '<button class="tbtn" data-t="' + t.id + '"><b>Équipe ' + t.id + "</b><span>" + esc(t.name) + "</span></button>").join("") + "</div>"
      : '<p class="muted">' + (p ? "Les équipes ne sont pas encore prêtes." : "Connexion…") + "</p>") +
    '<p class="muted small" style="margin-top:18px">Chef d\'équipe : le plus simple est de scanner le QR code de votre feuille.</p>' +
    '<p class="muted small">Sur chaque écran, le bouton 🚪 Quitter ramène ici. En cas de souci, ouvrez le lien avec <b>?reset</b> à la fin pour repartir de zéro sur ce téléphone.</p>' +
    (ESSAI ? '<div class="card" style="text-align:left;border-color:#ff9f1a"><h3>🧪 Vous êtes en mode essai</h3><p class="small">Tout ce que vous faites ici se passe dans une partie d\'entraînement séparée : la vraie soirée n\'est jamais touchée.</p><p class="small">Code animateur : <b>1234</b> · Code DJ : <b>5678</b></p><p class="small">Puis, dans l\'onglet 🎮 Jeu : « Remplir avec des données fictives ».</p><button class="btn ghost" id="hEssaiOff">Quitter le mode essai</button></div>'
      : '<button class="btn ghost" id="hEssai" style="margin-top:14px">🧪 Mode essai : s\'entraîner sans toucher à la vraie soirée</button>') + '</div>';
  $$("[data-r]", app).forEach((b) => (b.onclick = () => pickRole(b.dataset.r)));
  if ($("#hEssai")) $("#hEssai").onclick = async () => { if (await confirmBox("Passer ce téléphone en <b>mode essai</b> ? Vous pourrez tout tester (fausses équipes, QR codes, musique, impressions) dans une partie séparée. La vraie soirée reste intacte.", "Passer en mode essai")) setEssai(true); };
  if ($("#hEssaiOff")) $("#hEssaiOff").onclick = () => setEssai(false);
  $$("[data-t]", app).forEach((b) => (b.onclick = async () => {
    const id = Number(b.dataset.t);
    const c = await ask("Équipe " + id, { help: "Tapez le code de secours imprimé sur votre feuille.", upper: true, placeholder: "ex. K7QM" });
    if (c) login("team", c.toUpperCase(), id);
  }));
}
async function pickRole(r) {
  const p = S.pub;
  LS.set("bt_combo", r === "combo");
  if (r === "combo") r = "anim";
  if (!p) return toast("Connexion en cours…");
  if (r === "screen") { S.sess = { role: "screen" }; LS.set("bt_sess", S.sess); render(); pollNow(); wake(); return; }
  if (r === "anim" && p.needInit) {
    const c = await ask("Première utilisation", { help: "Choisissez votre code animateur (4 chiffres par exemple). Notez-le bien : il protège la partie.", numeric: true, type: "tel", ok: "Créer" });
    if (!c) return;
    if (c.length < 3) return toast("3 caractères minimum");
    try { await api("/init", { method: "POST", body: { code: c } }); } catch (e) { return toast(e.message); }
    return login("anim", c);
  }
  if (r === "dj" && !p.djReady) return toast("L'animateur n'a pas encore défini le code DJ", 3500);
  const c = await ask(r === "anim" ? "Code animateur" : "Code DJ", { numeric: true, type: "tel" });
  if (c) login(r, c);
}

/* ================= Équipe ================= */
function buildTeam(app) {
  S.built = "team"; S.formM = null; S.formKey = null; S.lastSig = "";
  app.innerHTML = '<div class="top"><div class="tt"><b id="tName">Mon équipe</b><small id="tMem"></small></div><button class="btn ghost sm" id="out">Quitter</button></div>' +
    '<div class="wrap" style="padding:0"><div id="tBan" class="banner"><b>Connexion…</b></div><div id="tForm"></div><div id="tSave" class="muted small center"></div><div id="tRes"></div></div>';
  $("#out").onclick = async () => { if (await confirmBox("Quitter l'équipe sur ce téléphone ?", "Quitter")) logout(); };
  S.tick = tickTeam;
  if (S.data && S.data.team) updTeam();
}
function updTeam() {
  const d = S.data; if (!d || !d.team) return;
  const p = d.pub;
  $("#tName").textContent = "Équipe " + d.team.id + " – " + d.team.name;
  $("#tMem").textContent = d.team.members.join(", ");
  const man = p.manches[p.m];
  if (p.status === "running" && man) {
    if (S.formKey !== p.runId + ":" + p.m) buildForm(p.m, man, (d.answers || {})[p.m] || [], p.runId);
    const open = man.state === "open";
    $$("#tForm .arow").forEach((r, i) => r.classList.toggle("cur", open && i === p.k));
    $$("#tForm input").forEach((i) => (i.disabled = !open));
    if (!open) { clearTimeout(S.saveT); $("#tSave").textContent = "🔒 Réponses verrouillées"; }
  } else if (p.status === "setup" && p.teamNames) {
    S.formM = null; S.formKey = null;
    if (!$("#tNameIn")) {
      $("#tForm").innerHTML = '<div class="card" style="margin:12px"><h3>✏️ Choisissez le nom de votre équipe</h3><p class="muted small">Mettez-vous d\'accord avec votre table ! Modifiable jusqu\'au début de la partie.</p><input id="tNameIn" maxlength="30" placeholder="Nom de l\'équipe (ou votre prénom si vous jouez seul)" value="' + (neutralName(d.team.name) ? "" : esc(d.team.name)) + '"><div class="row"><button class="btn ghost" id="tIdea">🎲 Une idée de nom</button></div><button class="btn big" id="tNameOk" style="margin-top:6px">✓ Valider ce nom</button></div>';
      $("#tIdea").onclick = () => { $("#tNameIn").value = TEAM_NAMES[Math.floor(Math.random() * TEAM_NAMES.length)]; };
      $("#tSave").textContent = "";
      $("#tNameOk").onclick = async () => {
        const n = $("#tNameIn").value.trim();
        if (n.length < 2) return toast("Tapez un nom (2 lettres minimum)");
        try { await api("/team/name", { method: "POST", body: { name: n } }); toast("✓ Votre équipe s'appelle « " + n + " »"); $("#tNameIn").blur(); pollNow(); }
        catch (e) { toast(e.message, 3500); }
      };
    }
  } else { $("#tForm").innerHTML = ""; S.formM = null; S.formKey = null; $("#tSave").textContent = ""; }
  const sig = JSON.stringify([p.status, p.manches.map((m) => m.state), d.me]);
  if (sig !== S.lastSig) { S.lastSig = sig; renderTeamRes(d); }
  tickTeam();
}
function buildForm(m, man, server, runId) {
  S.formM = m; S.formKey = runId + ":" + m; S.runId = runId;
  const key = "bt_ans_" + S.sess.teamId + "_" + runId + "_" + m;
  const local = LS.get(key, null);
  const vals = [];
  for (let i = 0; i < man.n; i++) {
    const sv = server[i] || {}, lv = (local && local[i]) || {};
    vals.push({ t: sv.t || lv.t || "", a: sv.a || lv.a || "" });
  }
  $("#tForm").innerHTML = '<h2 style="margin:16px 12px 4px">Manche ' + (m + 1) + " – " + esc(man.title) + (man.mult > 1 ? ' <span class="chip warn">points ×' + man.mult + "</span>" : "") + "</h2>" +
    '<p class="muted small" style="margin:0 12px">Tapez vos réponses au fur et à mesure. Elles sont enregistrées automatiquement, vous pouvez les modifier jusqu\'à la fin de la manche.</p>' +
    vals.map((v, i) => '<div class="arow" data-i="' + i + '"><div class="anum">' + (i + 1) + '</div><div class="ains">' +
      '<input class="ti" placeholder="Titre" value="' + esc(v.t) + '" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="100">' +
      '<input class="ar" placeholder="' + esc(man.label2) + '" value="' + esc(v.a) + '" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="100"></div></div>').join("");
  $$("#tForm input").forEach((i) => { i.addEventListener("input", schedSave); i.addEventListener("blur", () => { if (S.dirty) { clearTimeout(S.saveT); saveAnswers(); } }); });
  S.dirty = false;
  $("#tSave").textContent = "";
}
function schedSave() { S.dirty = true; $("#tSave").textContent = "✏️ …"; clearTimeout(S.saveT); S.saveT = setTimeout(saveAnswers, 700); }
async function saveAnswers() {

const PROBED = {};
function pvProbe(url) {
  if (PROBED[url] !== undefined) return Promise.resolve(PROBED[url]);
  return new Promise((res) => {
    const a = new Audio(); let done = false;
    const fin = (ok) => { if (done) return; done = true; PROBED[url] = ok; a.removeAttribute("src"); try { a.load(); } catch (e) {} res(ok); };
    a.preload = "metadata"; a.muted = true;
    a.onloadedmetadata = () => fin(true); a.oncanplay = () => fin(true); a.onerror = () => fin(false);
    setTimeout(() => fin(PROBED[url] === undefined ? null : PROBED[url]), 8000);
    a.src = url; try { a.load(); } catch (e) {}
  }).then((ok) => ok !== false);
}

// Vérifier tous les extraits d'un coup (onReplace : tirer un autre morceau du même style)
function pvCheckAll(manches, onChange, onReplace, lockedMsg) {
  const close = () => { pvStop(); closeModal(); };
  const stat = {};
  let h = '<h3>🔊 Vérifier les extraits</h3><p class="muted small">L\'appli cherche chaque morceau et teste vraiment sa lecture. ✓ = OK · ⚠️ = titre différent, écoutez · ✗ = introuvable ou illisible. ▶ pour écouter, « Changer » pour choisir une autre version' + (onReplace ? ", « 🎲 Autre morceau » pour remplacer par un autre morceau du même style" : "") + '.</p>' + (lockedMsg ? '<div class="lock">' + lockedMsg + "</div>" : "") + '<div id="caSum" class="row" style="align-items:center"></div><div id="caL">';
  manches.forEach((m, i) => { h += '<p style="margin:10px 0 0"><b>Manche ' + (i + 1) + " – " + esc(m.title) + "</b></p>"; m.songs.forEach((s, j) => { h += '<div class="pvrow" id="ca' + i + "_" + j + '"></div>'; }); });
  h += '</div><div class="row end"><button class="btn ghost" id="caX">Fermer</button></div>';
  const summary = (busy) => {
    const S2 = $("#caSum"); if (!S2) return;
    const v = Object.values(stat), ok = v.filter((x) => x === "ok").length, w = v.filter((x) => x === "warn").length, b = v.filter((x) => x === "bad").length;
    S2.innerHTML = '<b style="flex:1">' + ok + " ✓ · " + w + " ⚠️ · " + b + " ✗" + (busy ? " · recherche…" : b ? "" : " 👍") + "</b>" +
      (!busy && b && onReplace ? '<button class="btn sm" id="caAuto">🎲 Remplacer tous les ✗</button>' : "");
    const a = $("#caAuto"); if (a) a.onclick = autoAll;
  };
  const row = async (i, j) => {
    const r = $("#ca" + i + "_" + j); if (!r) return "gone";
    const s = manches[i].songs[j];
    r.innerHTML = '<div class="pt">' + (j + 1) + ". " + esc(s.t) + ' – <span class="muted">' + esc(s.a) + '</span><br><span class="small muted">🔎 recherche…</span></div>';
    const it = await pvResolve(s);
    let m = pvMatch(s, it), unplay = false;
    if (it && m !== "bad" && !(await pvProbe(it.url))) { m = "bad"; unplay = true; }
    if (!$("#ca" + i + "_" + j)) return "gone";
    stat[i + "_" + j] = m;
    r.innerHTML = '<div class="pt">' + (j + 1) + ". " + esc(s.t) + ' – <span class="muted">' + esc(s.a) + '</span><br><span class="small ' + (m === "bad" ? "" : "muted") + '"' + (m === "bad" ? ' style="color:var(--ko)"' : "") + ">" +
      (unplay ? "✗ trouvé mais illisible : " + esc(it.t) : it ? (m === "ok" ? "✓ " : "⚠️ ") + esc(it.t) + " – " + esc(it.a) + " (" + SRC[it.s] + ")" : "✗ introuvable") + "</span></div>" +
      (it ? '<button class="btn ghost sm" data-pp="1" data-url="' + esc(it.url) + '">▶</button>' : "") +
      (onChange ? '<button class="btn ghost sm" data-chg="1">Changer</button>' : "") +
      (onReplace && m !== "ok" ? '<button class="btn sm" data-rep="1">🎲 Autre morceau</button>' : "");
    const pb = r.querySelector("[data-pp]"); if (pb) pb.onclick = () => { if (PV.playing && PV.url === it.url) pvStop(); else pvPlay(it, 20); };
    const cb = r.querySelector("[data-chg]"); if (cb) cb.onclick = () => { pvStop(); pvPicker(s, (pv) => { onChange(i, j, pv); }); };
    const rb = r.querySelector("[data-rep]"); if (rb) rb.onclick = async () => { pvStop(); if (!(await onReplace(i, j))) return; await row(i, j); summary(false); };
    return m;
  };
  // Remplace chaque ✗ par un autre morceau du style, jusqu'à en trouver un (ou épuiser le style)
  const autoAll = async () => {
    const todo = Object.keys(stat).filter((k) => stat[k] === "bad");
    summary(true);
    for (const k of todo) {
      const [i, j] = k.split("_").map(Number);
      for (let n = 0; n < 10 && stat[k] === "bad"; n++) {
        if (!(await onReplace(i, j, true))) break;
        if ((await row(i, j)) === "gone") return;
      }
    }
    summary(false);
    const left = Object.values(stat).filter((x) => x === "bad").length;
    toast(left ? left + " morceau(x) toujours introuvable(s) : plus de morceaux de rechange dans ce style. Remplacez-le(s) à la main." : "Tous les morceaux sont trouvés 👍", 4500);
  };
  openModal(h, async (box) => {
    $("#caX", box).onclick = close;
    $("#modal").onclick = (e) => { if (e.target.id === "modal") close(); };
    summary(true);
    for (let i = 0; i < manches.length; i++) for (let j = 0; j < manches[i].songs.length; j++) {
      if ((await row(i, j)) === "gone") return;
      await new Promise((r) => setTimeout(r, 120));
    }
    summary(false);
  });
}

const sonoOn = () => { const r = S.sess && S.sess.role; return audioOn() && (r === "dj" || (r === "anim" && LS.get("bt_combo", false))) && LS.get("bt_sono", r === "dj"); };
function sonoSync() {
  const p = S.pub; if (!p || !sonoOn()) return;
  const songs = (S.data && (S.data.songs || (S.data.setup && S.data.setup.manches[p.m] && S.data.setup.manches[p.m].songs))) || [];
  const s = songs[p.k];
  const key = p.runId + ":" + p.m + ":" + p.k + ":" + (p.started ? p.phaseStart : 0);
  // coupure demandée à distance
  if (PV.cutSeen === undefined) PV.cutSeen = p.cutAt || 0;
  else if ((p.cutAt || 0) !== PV.cutSeen) { PV.cutSeen = p.cutAt || 0; if (PV.playing) { pvStop(); toast("⏹ Musique coupée par l'animateur"); } }
  if (key === PV.sonoKey) return;
  const prev = PV.sonoKey; PV.sonoKey = key;
  if (prev === undefined) return; // premier passage : on ne rejoue pas un extrait déjà lancé
  if (!p.started || p.status !== "running" || !s) { if (PV.playing && PV.byGame) pvStop(); return; }
  if (PV.localKey && Date.now() - PV.localAt < 4000) return; // lancé depuis ce téléphone : déjà en cours
  const el = (Date.now() + S.offset - p.phaseStart) / 1000;
  if (el > p.extractSec - 1) return; // trop tard, l'extrait est déjà fini
  const late = Math.max(0, el);
  PV.byGame = true;
  pvGo(Object.assign({}, s, { o: (Number(s.o) || 0) + late, d: Math.max(2, p.extractSec - late) }), p.extractSec - late, true);
}

function fitQr() {

async function fakeFill() {
  if (!ESSAI) return;
  const n = await ask("Combien de faux invités ?", { numeric: true, value: "60", help: "Ils seront répartis en équipes d'environ 8 personnes (couples ensemble, jeunes / moyens / anciens mélangés). Les équipes et manches actuelles de l'essai seront remplacées." });
  if (!n) return;
  const N = Math.max(4, Math.min(300, Number(n) || 60));
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const units = []; let c = 0;
  while (c < N) {
    const ln = pick(FAKE_LN), tr = pick(["J", "M", "M", "A"]);
    const mem = [{ n: pick(FAKE_FN) + " " + ln, tr }];
    if (c + 1 < N && Math.random() < 0.55) { let f2; do { f2 = pick(FAKE_FN); } while (mem[0].n.startsWith(f2 + " ")); mem.push({ n: f2 + " " + ln, tr }); }
    units.push({ members: mem, tr }); c += mem.length;
  }
  S.people = units; LS.set("bt_people", units);
  S.draft.teams = drawTeams(units, Math.max(2, Math.round(c / 8)));
  S.draft.manches = defaultManches().map((m) => Object.assign(m, { songs: pickSongs(m.theme, 5, new Set()) }));

}

  if (film.length) h += "Manche" + (film.length > 1 ? "s " : " ") + film.map((x) => (x.i + 1) + " (" + esc(x.m.title) + ")").join(", ") + " : on donne le titre et <b>le " + esc(film[0].m.label2.toLowerCase()) + "</b> au lieu de l'artiste.<br>";

function trOf(mem) { const c = {}; mem.forEach((m) => { if (m.tr) c[m.tr] = (c[m.tr] || 0) + 1; }); let b = "", n = 0; Object.keys(c).forEach((k) => { if (c[k] > n) { n = c[k]; b = k; } }); return b; }

// Lignes de données (après la ligne des titres), chacune avec son numéro de ligne Excel
function impData(imp) { return imp.all.slice(imp.hdrRow + 1).filter((x) => x.cells.some((c) => String(c).trim())); }
function impHeader(imp) { return imp.hdrRow >= 0 ? imp.all[imp.hdrRow].cells.map(String) : []; }
// Une entrée par ligne : la personne, son conjoint, ses invités
function impEntries(imp) {
  const M = imp.map, H = impHeader(imp).map((x) => x.trim().toLowerCase());
  const val = (r, c) => (c === "" || c == null ? "" : String(r[Number(c)] == null ? "" : r[Number(c)]).trim());
  const out = [];
  impData(imp).forEach((x) => {
    const r = x.cells;
    const name = [val(r, M.first), val(r, M.name)].filter(Boolean).join(" ").replace(/\s+/g, " ");
    if (!name) return;

    if (sp && !/^(non|n|no|0|-|\/|aucun|aucune|n[eé]ant|sans)$/i.test(sp)) mem.push({ n: /^(oui|o|yes|y|1|x)$/i.test(sp) ? "Conjoint(e) de " + name : sp, tr });
    const nb = parseInt(val(r, M.count), 10) || 0;
    for (let k = 1; k <= Math.min(nb, 10); k++) mem.push({ n: "Invité " + k + " de " + name, tr: "" });
    // lignes à écarter d'office : totaux, titres répétés, nombres seuls

function unitsFromImport(imp) {

    if (e.gk) { const k = e.gk.toLowerCase(); if (!groups.has(k)) { const u = { members: [] }; groups.set(k, u); units.push(u); } groups.get(k).members.push(...e.mem); }

function guessHeaderRow(all) {

  const lim = Math.min(all.length, 15);
  for (let i = 0; i < lim; i++) { const c = all[i].cells.filter((x) => String(x).trim()); if (c.length >= 1 && c.some((x) => KW.test(x)) && c.every((x) => !/^\d+([.,]\d+)?$/.test(String(x).trim()))) return i; }

function drawTeams(units, T) {

  const buckets = {};
  units.forEach((u) => { const k = u.tr || "?"; (buckets[k] = buckets[k] || []).push(u); });
  let order = [];
  ["J", "M", "A", "?"].forEach((k) => { if (buckets[k]) order = order.concat(shuffle(buckets[k]).sort((a, b) => b.members.length - a.members.length)); });
  order.forEach((u) => {
    const k = u.tr || "?"; let best = null;
    shuffle(teams).forEach((t) => {
      if (!best) { best = t; return; }
      const a = t.members.length + u.members.length, b = best.members.length + u.members.length;
      if (a < b || (a === b && (t.tr[k] || 0) < (best.tr[k] || 0))) best = t;

    best.members.push(...u.members.map((m) => m.n)); best.tr[k] = (best.tr[k] || 0) + u.members.length;

function readFile(file, v) {
  const go = () => {
    if (!window.XLSX) return setTimeout(go, 200);
    const fr = new FileReader();
    fr.onload = () => {
      try {
        let wb;
        if (/\.(csv|txt)$/i.test(file.name)) {
          let txt = new TextDecoder("utf-8").decode(new Uint8Array(fr.result));
          if (txt.includes("�")) txt = new TextDecoder("windows-1252").decode(new Uint8Array(fr.result));
          wb = XLSX.read(txt, { type: "string" });
        } else wb = XLSX.read(new Uint8Array(fr.result), { type: "array" });
        const pick = (name) => {
          const ws = wb.Sheets[name];
          const off = ws["!ref"] ? XLSX.utils.decode_range(ws["!ref"]).s.r : 0;
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false, blankrows: true });
          const all = rows.map((cells, k) => ({ n: k + off + 1, cells: cells.map((c) => String(c == null ? "" : c)) })).filter((x) => x.cells.some((c) => c.trim()));
          if (!all.length) return toast("Cette feuille est vide");
          const hdrRow = guessHeaderRow(all);
          S.imp = { all, hdrRow, map: guessMap(hdrRow >= 0 ? all[hdrRow].cells : []), off: {}, q: "", file: file.name, sheets: wb.SheetNames, sheet: name, wb };
          renderImpMap(v);
        };
        S.impPick = pick;
        pick(wb.SheetNames[0]);
      } catch (e) { toast("Impossible de lire ce fichier"); }
    };
    fr.readAsArrayBuffer(file);
  };
  go();
}

  const big = (title, url, sub) => openModal("<h3 class=\"center\">" + esc(title) + '</h3><div class="qrbox" style="width:300px">' + qrSvg(url) + "</div>" + (sub ? '<p class="center">' + sub + "</p>" : "") + '<div class="row end"><button class="btn" id="bq">Fermer</button></div>', (b) => ($("#bq", b).onclick = closeModal));
  $$("[data-qt]", v).forEach((e) => (e.onclick = () => { const t = st.teams[Number(e.dataset.qt)]; big("Équipe " + t.id + " – " + t.name, teamUrl(t), "Code de secours : <b>" + esc(t.code) + "</b>"); }));
  const bdj = $('[data-big="dj"]', v); if (bdj) bdj.onclick = () => big("DJ", djUrl, "Code DJ : <b>" + esc(st.codes.dj) + "</b>");
  $('[data-big="sc"]', v).onclick = () => big("Écran géant", scUrl);
  $("#cpSc").onclick = () => copyText(scUrl);
  $("#shAnim").onclick = () => { $("#animQr").innerHTML = '<div class="qrbox">' + qrSvg(base + "/?r=anim&c=" + encodeURIComponent(st.codes.anim) + ESSAI_Q) + '</div><p class="center small">Code animateur : <b>' + esc(st.codes.anim) + "</b></p>"; };
  const on = (id, fn) => { const e = $("#" + id); if (e) e.onclick = fn; };
  on("pTeams", () => doPrint(st.teams.map((t) => '<div class="sheet"><div class="ev">' + esc(st.name) + '</div><div class="tn">ÉQUIPE ' + t.id + '</div><div class="tname">' + (st.teamNames !== false ? "Nom de l\'équipe : à choisir sur votre téléphone 📱" : esc(t.name)) + '</div><div class="q">' + qrSvg(teamUrl(t)) + '</div><div class="how">📱 Scannez ce QR code avec l\'appareil photo de votre téléphone.</div><div class="code">Code de secours : <b>' + esc(t.code) + '</b></div><div class="left"><b>Membres de l\'équipe</b><ul>' + t.members.map((m) => "<li>• " + esc(m) + "</li>").join("") + "</ul></div></div>").join("")));
  on("pList", () => doPrint('<div class="sheet left"><h2>' + esc(st.name) + " – Les équipes</h2><table><tr><th>N°</th><th>Équipe</th><th>Code</th><th>Membres</th></tr>" + st.teams.map((t) => "<tr><td>" + t.id + "</td><td><b>" + esc(t.name) + "</b></td><td>" + esc(t.code) + "</td><td>" + t.members.map(esc).join(", ") + "</td></tr>").join("") + "</table></div>"));
  on("pDj", () => doPrint('<div class="sheet"><div class="ev">' + esc(st.name) + '</div><div class="tn">DJ</div><div class="q" style="width:60mm">' + qrSvg(djUrl) + '</div><div class="code">Code DJ : <b>' + esc(st.codes.dj) + '</b></div></div><div class="sheet left"><h2>Playlist dans l\'ordre</h2><p>Extraits de ' + st.extractSec + " s, puis " + st.answerSec + " s de silence.</p>" + st.manches.map((m, i) => "<h3>Manche " + (i + 1) + " – " + esc(m.title) + (m.mult > 1 ? " (points ×" + m.mult + ")" : "") + "</h3><table>" + m.songs.map((s, j) => "<tr><td>" + (j + 1) + "</td><td><b>" + esc(s.t) + "</b></td><td>" + esc(s.a) + "</td><td>" + esc(s.h) + "</td></tr>").join("") + "</table>").join("") + "</div>"));
  on("cpDj", () => copyText(playlistText(st.manches)));
  const sc = st.scoring, both = sc.title + sc.artist;
  const ansSheet = (t) => {
    const who = t ? "Équipe " + t.id + " – " + esc(t.name) : "Équipe n° ____ : ______________________";
    return '<div class="sheet left"><div class="ev c center">' + esc(st.name) + '</div><h2 class="c center">' + who + '</h2><p class="hint center">Écrivez le titre et l\'artiste de chaque morceau. Titre = ' + pts(sc.title) + ", artiste = " + pts(sc.artist) + ", les deux = " + pts(both) + ". Rendez la feuille à l'animateur à la fin de la partie.</p><div class=\"pgrid\">" +
      st.manches.map((m, i) => '<div class="pb"><div class="ph2"><span>Manche ' + (i + 1) + " – " + esc(m.title) + (m.mult > 1 ? " (points ×" + m.mult + ")" : "") + "</span><span>" + (t ? "Éq. " + t.id : "") + '</span></div><table class="ans"><tr><th class="no"></th><th style="width:55%">Titre</th><th>' + esc(m.label2 === "Artiste" || !m.label2 ? "Artiste" : "Film / dessin animé") + '</th><th class="ck">Pts</th></tr>' +
        m.songs.map((_, j) => '<tr><td class="no">' + (j + 1) + '</td><td></td><td></td><td class="ck"></td></tr>').join("") + '<tr class="tot"><td colspan="3" style="text-align:right;font-weight:700">Total manche ' + (i + 1) + '</td><td class="ck"></td></tr></table></div>').join("") + '</div><table class="ans" style="margin-top:3mm"><tr class="tot"><td style="text-align:right;font-weight:800;font-size:11pt">TOTAL DE L\'ÉQUIPE</td><td class="ck" style="width:20mm"></td></tr></table></div>';
  };
  on("pAns", () => doPrint(st.teams.map(ansSheet).join("")));
  on("pBlank", () => doPrint(ansSheet(null)));
  on("pKey", () => doPrint('<div class="sheet left"><h2>Corrigé – ' + esc(st.name) + '</h2><p class="hint">Titre = ' + pts(sc.title) + ", artiste = " + pts(sc.artist) + ", les deux = " + pts(both) + ". Fautes de frappe tolérées.</p><div class=\"pgrid\">" +
    st.manches.map((m, i) => '<div class="pb"><div class="ph2"><span>Manche ' + (i + 1) + " – " + esc(m.title) + "</span><span>" + (m.mult > 1 ? "×" + m.mult + " · " + pts(both * m.mult) + "/morceau" : pts(both) + "/morceau") + '</span></div><table class="ans key"><tr><th class="no"></th><th style="width:55%">Titre</th><th>' + esc(m.label2 || "Artiste") + "</th></tr>" +
      m.songs.map((x, j) => '<tr><td class="no">' + (j + 1) + "</td><td><b>" + esc(x.t) + "</b></td><td>" + esc(x.a) + "</td></tr>").join("") + "</table></div>").join("") + "</div></div>"));
  on("pScore", () => doPrint('<div class="sheet left"><h2>Tableau des scores – ' + esc(st.name) + '</h2><p class="hint">Reportez le total de chaque manche. Maximum possible : ' + pts(maxPoints(st)) + '.</p><table class="sc"><tr><th>N°</th><th>Équipe</th>' + st.manches.map((m, i) => "<th>M" + (i + 1) + (m.mult > 1 ? " ×" + m.mult : "") + "</th>").join("") + "<th>Total</th><th>Rang</th></tr>" +
    st.teams.map((t) => "<tr><td>" + t.id + "</td><td>" + esc(t.name) + "</td>" + st.manches.map(() => "<td></td>").join("") + "<td></td><td></td></tr>").join("") + "</table></div>"));
  on("pRules", () => doPrint('<div class="sheet left">' + rulesHtml(Object.assign({}, S.pub, { name: st.name, scoring: st.scoring, extractSec: st.extractSec, answerSec: st.answerSec, teams: st.teams, manches: st.manches.map((m) => ({ title: m.title, mult: m.mult || 1, n: m.songs.length, label2: m.label2 })) }), false) + "</div>"));
}

/* ---- Onglet Réglages ---- */
function tabReglages(v) {
  const st = S.draft;
  v.innerHTML = '<div class="card keep" id="savesCard"><h3>💾 Mes parties enregistrées</h3><p class="muted small">Préparez une partie (équipes + manches), enregistrez-la : elle restera figée jusqu\'au jour J. Vous pouvez en garder plusieurs et charger celle du soir.</p>' +
    (st.loadedFrom ? '<p>Partie actuelle : <b>' + esc(st.loadedFrom.name) + '</b></p>' : '') +
    '<div class="row"><input id="svName" class="grow" style="flex:1" maxlength="60" placeholder="Nom de la partie (ex. Soirée amicale 2026)" value="' + esc(st.loadedFrom ? st.loadedFrom.name : st.name) + '"></div>' +
    '<div class="row">' + (st.loadedFrom ? '<button class="btn ok" id="svUpd">💾 Mettre à jour « ' + esc(st.loadedFrom.name) + ' »</button>' : '') + '<button class="btn ' + (st.loadedFrom ? 'ghost' : 'ok') + '" id="svNew">➕ Enregistrer comme nouvelle partie</button></div>' +
    '<div id="svList" class="muted small">Chargement…</div></div>' +
    '<div class="card keep"><h3>La soirée</h3><label class="f">Nom de la soirée</label><input id="rName" maxlength="60" value="' + esc(st.name) + '">' +
    '<label class="f">Adresse de l\'appli (pour les QR codes)</label><input id="rBase" placeholder="' + esc(location.origin) + '" value="' + esc(st.baseUrl || "") + '"><p class="muted small">Laissez vide pour utiliser l\'adresse actuelle.</p>' +
    '<label class="f">Mon service de musique (liens de secours)</label><select id="rSvc">' + [["", "Tous (Apple Music, Spotify, Deezer, YouTube)"], ["am", "🍎 Apple Music"], ["sp", "🟢 Spotify"], ["dz", "🟣 Deezer"], ["yt", "▶ YouTube"]].map(([k, l]) => '<option value="' + k + '"' + ((st.service || "") === k ? " selected" : "") + ">" + l + "</option>").join("") + '</select><p class="muted small">L\'appli joue elle-même les extraits, sans compte. Ce service sert de secours : son lien s\'affiche en premier chez le DJ.</p></div>' +
    '<div class="card keep"><h3>📺 Adresse de l\'écran géant</h3><p class="small">À taper sur l\'ordinateur branché au vidéoprojecteur (puis double-clic pour le plein écran) :</p><div class="url">' + esc(screenUrl().replace(/^https?:\/\//, "")) + '</div><div class="row"><button class="btn ghost sm" id="rCpSc">📋 Copier l\'adresse</button></div>' + (ESSAI ? '<p class="muted small">C\'est l\'adresse de l\'écran du mode essai. Le jour J : <b>' + esc((baseUrl() + "/ecran").replace(/^https?:\/\//, "")) + "</b></p>" : "") + '</div>' +
    '<div class="card keep"><h3>📺 Appli pour dongle Android TV</h3><p class="small">Pour brancher l\'écran géant sans PC : installez l\'appli « Blind test – Écran » sur le dongle du vidéoprojecteur (Android TV, Google TV, Fire TV). Elle s\'ouvre directement en plein écran.</p><div class="url">' + esc((baseUrl() + "/tv.apk").replace(/^https?:\/\//, "")) + '</div>' +
    '<details><summary class="small">Comment l\'installer ?</summary><ol class="pl small"><li>Sur le dongle, installez l\'appli gratuite <b>Downloader</b> (Play Store ou Amazon Appstore).</li><li>Autorisez-la à installer des applis : Paramètres → Applis → Sécurité / Sources inconnues → Downloader.</li><li>Dans Downloader, tapez l\'adresse ci-dessus, puis « Installer ».</li><li>L\'appli « Blind test – Écran » apparaît avec vos applis.</li></ol><p class="small">Télécommande : <b>OK</b> = recharger · <b>OK 5 fois</b> (ou Menu) = basculer vraie soirée / mode essai · <b>Retour 2 fois</b> = quitter.</p></details></div>' +
    '<div class="card keep"><h3>🧠 Morceaux déjà joués</h3><p class="small">' + plural(((S.data && S.data.played) || []).length, "morceau joué", "morceaux joués") + ' lors des parties précédentes. Au tirage au sort, l\'appli prend d\'abord des morceaux jamais joués.</p><button class="btn ghost" id="rPlayed">🧹 Oublier l\'historique</button></div>' +
    '<div class="card keep"><h3>Codes d\'accès</h3><div class="row"><span class="grow">Code animateur : <b>' + esc(st.codes.anim) + '</b></span><button class="btn ghost sm" id="rCA">Changer</button></div>' +
    '<div class="row"><span class="grow">Code DJ : <b>' + (st.codes.dj ? esc(st.codes.dj) : '<span style="color:var(--ko)">non défini</span>') + '</b></span><button class="btn ghost sm" id="rCD">' + (st.codes.dj ? "Changer" : "Définir") + "</button></div></div>" +
    '<div class="card keep"><h3>Noms d\'équipe</h3><label class="row"><input type="checkbox" id="rTN" style="width:auto"' + (st.teamNames !== false ? " checked" : "") + '> Les chefs d\'équipe choisissent leur nom sur leur téléphone (avant le début de la partie)</label><p class="muted small">Sinon, les noms tirés au sort (modifiables dans Équipes) sont gardés.</p></div>' +
    '<div class="card keep"><h3>Barème et chrono</h3><div class="row"><label class="grow">Points pour le titre<input type="number" id="rPT" min="0" max="10" value="' + st.scoring.title + '"></label><label class="grow">Points pour l\'artiste<input type="number" id="rPA" min="0" max="10" value="' + st.scoring.artist + "\"></label></div>" +
    '<div class="row"><label class="grow">Durée de l\'extrait (s)<input type="number" id="rEx" min="5" max="90" value="' + st.extractSec + '"></label><label class="grow">Silence pour écrire (s)<input type="number" id="rAn" min="3" max="90" value="' + st.answerSec + '"></label></div>' +
    '<p class="muted small">Titre et artiste trouvés = ' + (st.scoring.title + st.scoring.artist) + " points ; un seul des deux = " + st.scoring.title + " ou " + st.scoring.artist + " point(s). Les manches « ×2 » doublent les points. Les fautes de frappe sont tolérées.</p></div>" +
    '<div class="card"><h3>Réutiliser l\'appli</h3><p class="muted small">Sauvegardez vos manches et réglages dans un fichier pour une prochaine soirée.</p><div class="row"><button class="btn ghost keep" id="rExp">⬇️ Exporter la configuration</button><label class="btn ghost">📂 Importer une configuration<input type="file" id="rImp" accept=".json" hidden></label></div></div>' +
    '<div class="card keep"><h3>Partie</h3><div class="row"><button class="btn warn" id="rReset">🔄 Remettre la partie à zéro</button><button class="btn ko" id="rNew">🆕 Nouvelle soirée (vider les équipes)</button></div><p class="muted small">« Remettre à zéro » efface les réponses et les scores mais garde équipes et manches (idéal après une répétition).</p></div>' +
    '<div class="card keep"><button class="btn ghost" id="rReload">↻ Recharger depuis le serveur</button> <button class="btn ghost" id="rOut">🚪 Se déconnecter</button></div>';
  const partialSave = async (setup) => { try { await api("/setup", { method: "POST", body: { setup, partial: true } }); chip("✓ Enregistré", "ok"); pollNow(); } catch (e) { chip("⚠️ " + e.message, "ko"); } };
  let t1 = null;
  const deb = (fn) => { clearTimeout(t1); chip("Enregistrement…"); t1 = setTimeout(fn, 700); };
  $("#rName").oninput = (e) => { st.name = e.target.value; deb(() => partialSave({ name: st.name })); };
  $("#rCpSc").onclick = () => copyText(screenUrl());
  $("#rSvc").onchange = (e) => { st.service = e.target.value; partialSave({ service: st.service }); };
  $("#rPlayed").onclick = async () => { if (await confirmBox("Oublier la liste des morceaux déjà joués ? Ils pourront de nouveau être tirés au sort.", "Oublier")) { try { await api("/played/reset", { method: "POST" }); toast("Historique effacé"); S.data.played = []; tabReglages(v); } catch (e) { toast(e.message); } } };
  $("#rBase").oninput = (e) => { st.baseUrl = e.target.value.trim(); deb(() => partialSave({ baseUrl: st.baseUrl })); };
  const num = (id, fn) => ($("#" + id).onchange = (e) => { fn(Number(e.target.value)); partialSave({ scoring: st.scoring, extractSec: st.extractSec, answerSec: st.answerSec }); });
  num("rPT", (x) => (st.scoring.title = Math.max(0, Math.min(10, x || 0))));
  num("rPA", (x) => (st.scoring.artist = Math.max(0, Math.min(10, x || 0))));
  num("rEx", (x) => (st.extractSec = Math.max(5, Math.min(90, x || 15))));
  num("rAn", (x) => (st.answerSec = Math.max(3, Math.min(90, x || 10))));
  $("#rTN").onchange = (e) => { st.teamNames = e.target.checked; partialSave({ teamNames: st.teamNames }); };
  const setCode = async (kind) => {
    const c = await ask(kind === "anim" ? "Nouveau code animateur" : "Code du DJ", { numeric: true, type: "tel", help: "3 à 12 caractères (4 chiffres conseillés). Notez-le bien !" });
    if (c == null) return; if (c.length < 3) return toast("3 caractères minimum");
    if (kind === "anim" && c === st.codes.dj) return toast("Le code animateur doit être différent du code DJ");
    if (kind === "dj" && c === st.codes.anim) return toast("Le code DJ doit être différent du code animateur");
    const codes = Object.assign({}, st.codes); codes[kind] = c;
    try {
      await api("/setup", { method: "POST", body: { setup: { codes }, partial: true } });
      st.codes = codes; if (kind === "anim") { S.sess.code = c; LS.set("bt_sess", S.sess); }
      toast("Code enregistré ✓"); tabReglages(v); pollNow();
    } catch (e) { toast(e.message); }
  };
  $("#rCA").onclick = () => setCode("anim"); $("#rCD").onclick = () => setCode("dj");
  $("#rExp").onclick = () => {
    const cfg = { app: "blindtest", v: 1, name: st.name, scoring: st.scoring, extractSec: st.extractSec, answerSec: st.answerSec, manches: st.manches, teams: st.teams };
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(cfg, null, 1)], { type: "application/json" })); a.download = "blind-test-config.json"; a.click();
  };
  $("#rImp").onchange = (e) => {
    const f = e.target.files[0]; if (!f) return; const fr = new FileReader();
    fr.onload = async () => {
      try {
        const c = JSON.parse(fr.result); if (c.app !== "blindtest" || !Array.isArray(c.manches)) throw 0;
        const withTeams = Array.isArray(c.teams) && c.teams.length && (await confirmBox("Importer aussi les " + c.teams.length + " équipes de ce fichier ?", "Oui, avec les équipes"));
        Object.assign(st, { name: c.name || st.name, scoring: c.scoring || st.scoring, extractSec: c.extractSec || st.extractSec, answerSec: c.answerSec || st.answerSec, manches: c.manches });
        if (withTeams) st.teams = c.teams;
        saveDraft(true); toast("Configuration importée ✓"); tabReglages(v);
      } catch (x) { toast("Fichier de configuration invalide"); }
    };
    fr.readAsText(f); e.target.value = "";
  };
  $("#rReset").onclick = async () => { if (await confirmBox("Remettre la partie à zéro ? Les réponses et les scores seront effacés. Les équipes et les manches sont conservées.", "Remettre à zéro", true)) { try { await api("/reset", { method: "POST", body: { mode: "game" } }); toast("Partie remise à zéro"); S.lastSig = ""; pollNow(); } catch (e) { toast(e.message); } } };
  $("#rNew").onclick = async () => { if (await confirmBox("Nouvelle soirée ? Les équipes, réponses et scores seront effacés. Les manches et les codes sont conservés.", "Nouvelle soirée", true)) { try { await api("/reset", { method: "POST", body: { mode: "soiree" } }); S.draft.teams = []; S.people = null; LS.del("bt_people"); toast("Nouvelle soirée prête"); pollNow(); tabReglages(v); } catch (e) { toast(e.message); } } };
  loadSaves(v);
  const doSave = async (id) => {
    const name = $("#svName").value.trim();
    if (!name) return toast("Donnez un nom à la partie");
    clearTimeout(sdT);
    try { await api("/setup", { method: "POST", body: { setup: S.draft, partial: isLocked() } }); await api("/saves", { method: "POST", body: { name, id } }); toast("💾 Partie « " + name + " » enregistrée"); S.draft = null; pollNow(); setTimeout(() => { if (S.tab === "reglages") renderTab(); }, 900); }
    catch (e) { toast(e.message, 3500); }
  };
  $("#svNew").onclick = () => doSave(null);
  if ($("#svUpd")) $("#svUpd").onclick = () => doSave(st.loadedFrom.id);
  $("#rReload").onclick = () => { S.draft = null; S.lastSig = ""; pollNow(); toast("Rechargé"); };
  $("#rOut").onclick = async () => { if (await confirmBox("Se déconnecter de ce téléphone ? (Gardez votre code animateur !)", "Se déconnecter")) logout(); };
  lockInputs(v);
}

async function loadSaves(v) {
  const box = $("#svList", v); if (!box) return;
  try {
    const r = await api("/saves");
    if (!r.saves.length) { box.innerHTML = "Aucune partie enregistrée pour l'instant."; return; }
    const d = (t) => new Date(t).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    box.innerHTML = r.saves.map((x) => '<div class="tcard"><b>' + esc(x.name) + (r.current && r.current.id === x.id ? ' <span class="chip ok">chargée</span>' : '') + '</b><div class="muted small">' + plural(x.teams, "équipe") + " · " + plural(x.manches, "manche") + " · " + plural(x.songs, "morceau", "morceaux") + " · enregistrée le " + d(x.savedAt) + '</div><div class="row"><button class="btn alt sm" data-ld="' + x.id + '">📂 Charger</button><button class="btn ghost sm" data-dl="' + x.id + '">🗑 Supprimer</button></div></div>').join("");
    $$("[data-ld]", box).forEach((b) => (b.onclick = async () => {
      const x = r.saves.find((y) => y.id === b.dataset.ld);
      if (!(await confirmBox("Charger « " + esc(x.name) + " » ? Les équipes et manches actuelles seront remplacées (pensez à enregistrer avant si besoin). Les scores sont remis à zéro.", "Charger"))) return;
      try { await api("/saves/load", { method: "POST", body: { id: x.id } }); S.draft = null; S.lastSig = ""; toast("📂 « " + x.name + " » chargée"); pollNow(); setTimeout(() => renderTab(), 900); } catch (e) { toast(e.message, 3500); }
    }));
    $$("[data-dl]", box).forEach((b) => (b.onclick = async () => {
      const x = r.saves.find((y) => y.id === b.dataset.dl);
      if (!(await confirmBox("Supprimer définitivement « " + esc(x.name) + " » ?", "Supprimer", true))) return;
      try { await api("/saves/delete", { method: "POST", body: { id: x.id } }); toast("Partie supprimée"); loadSaves(v); } catch (e) { toast(e.message); }
    }));
  } catch (e) { box.textContent = "Impossible de charger la liste : " + e.message; }
}

/* ================= Démarrage ================= */
if (ESSAI) {
  document.body.classList.add("essai");
  const b = document.createElement("div"); b.id = "essaiBar";
  b.innerHTML = '<span>🧪 MODE ESSAI · la vraie soirée n\'est pas touchée</span><button id="ebOff">Quitter l\'essai</button>';
  document.body.insertBefore(b, $("#app"));
  $("#ebOff").onclick = async () => { if (await confirmBox("Quitter le mode essai et revenir à la vraie soirée sur ce téléphone ?", "Quitter l'essai")) setEssai(false); };
}
render();
poll();
wake();
</script>
